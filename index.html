<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100d">
<title>ROSTIZAME — Archivo 13</title>
<!-- Publicación Rostizame -->
<style>
*{box-sizing:border-box} body{margin:0;background:#0d0d0b;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.kicker{font-weight:800;letter-spacing:.12em}.sub,.hint{color:#aaa;font-size:12px}.screen{margin-top:12px;border:1px solid #454238;border-radius:14px;overflow:hidden;background:#11100d}
canvas{display:block;width:100%;height:auto;touch-action:manipulation}.msg{text-align:center;min-height:44px;padding:12px 4px;font-size:14px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:500px;margin:auto}.center{display:flex;justify-content:center;margin-top:12px}
button{min-height:54px;border-radius:12px;border:1px solid #5d594c;background:#191814;color:#f0ecdd;padding:10px 14px;font:700 15px inherit;cursor:pointer}
button.primary{background:#e4d15b;color:#16150f;border-color:#e4d15b}button:focus-visible{outline:3px solid white;outline-offset:2px}
.hidden{display:none!important}.hint{text-align:center;margin-top:12px;line-height:1.45}@media(max-width:380px){.wrap{padding:10px}.actions{gap:8px}button{font-size:13px;padding:8px}}
</style>
</head>
<body>
<main class="wrap">
<div class="top"><div><div class="kicker">BV // ARCHIVO 13</div><div class="sub">NIVEL 13 · CUIDADO EN REPETICIÓN</div></div><div id="hud" class="hidden">🌾 <b id="score">0</b>/13 · ❤️ <b id="lives">3</b></div></div>
<div class="screen"><canvas id="game" width="720" height="470" aria-label="Juego Archivo 13"></canvas></div>
<div id="msg" class="msg" aria-live="polite">Se ha detectado un archivo vinculado a este ejemplar.</div>
<div id="intro" class="center"><button id="accept" class="primary">ACEPTO HACERME CARGO</button></div>
<div id="controls" class="hidden">
 <div class="actions"><button id="feed" class="primary">🌾 DAR SEMILLA<br><small>a Filemón</small></button><button id="back">🐢 DEVOLVER<br><small>la tortuga</small></button></div>
 <div class="center"><button id="restart">REINICIAR</button></div>
</div>
<div id="endControls" class="hidden center"><button id="endButton" class="primary"></button></div>
<div class="hint">🔊 El sonido comienza después de tocar la pantalla. No requiere registro, permisos ni instalación.</div>
</main>
<script>
(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),S=document.querySelector('#score'),L=document.querySelector('#lives'),M=document.querySelector('#msg'),hud=document.querySelector('#hud'),intro=document.querySelector('#intro'),controls=document.querySelector('#controls'),end=document.querySelector('#endControls'),endBtn=document.querySelector('#endButton');let run=false,raf=0,last=0,elapsed=0,hunger=28,turtle=12,score=0,lives=3,seed=null,eat=0,audio=null,marMsg=false;
function audioOn(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}if(audio&&audio.state==='suspended')audio.resume()}
function tone(f,s,d,v,type='sine'){if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime+s);a.gain.setValueAtTime(.0001,audio.currentTime+s);a.gain.exponentialRampToValueAtTime(v,audio.currentTime+s+.01);a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+s+d);o.connect(a);a.connect(audio.destination);o.start(audio.currentTime+s);o.stop(audio.currentTime+s+d+.02)}
function chirp(){audioOn();tone(1450,0,.07,.055);tone(1900,.075,.08,.05);tone(1650,.16,.055,.03)}function stepSound(){audioOn();tone(210,0,.06,.025,'triangle');tone(165,.07,.07,.02,'triangle')}function failSound(){audioOn();tone(240,0,.14,.04,'sawtooth');tone(160,.15,.25,.035,'sawtooth')}function winSound(){audioOn();tone(520,0,.1,.035);tone(660,.12,.1,.035);tone(880,.25,.2,.04)}
function bg(){g.fillStyle='#11100d';g.fillRect(0,0,720,470);g.strokeStyle='#292720';for(let y=40;y<470;y+=38){g.beginPath();g.moveTo(0,y);g.lineTo(720,y);g.stroke()}}
function text(t,x,y,size=15,bold=false,align='center'){g.fillStyle='#e6e1cf';g.textAlign=align;g.font=(bold?'bold ':'')+size+'px monospace';g.fillText(t,x,y)}
function introDraw(){bg();text('BV',360,78,18,true);text('ARCHIVO // 13',360,132,31,true);g.fillStyle='#605c4d';g.fillRect(235,155,250,1);text('NOS VAMOS A MAR CHIQUITA.',360,205,18,true);text('FILEMÓN Y LA TORTUGA',360,250,15);text('QUEDAN BAJO SU RESPONSABILIDAD.',360,280,15);text('ADVERTENCIA',360,340,13,true);text('¿ACEPTA HACERSE CARGO?',360,405,14,true)}
function bird(){g.save();g.translate(185,198);if(eat>0)g.scale(1.08,1.08);g.fillStyle='#d4bd39';g.beginPath();g.ellipse(0,0,43,52,0,0,Math.PI*2);g.fill();g.fillStyle='#dfca48';g.beginPath();g.ellipse(-18,10,24,34,-.4,0,Math.PI*2);g.fill();g.fillStyle='#f1e9c6';g.beginPath();g.arc(15,-14,7,0,Math.PI*2);g.fill();g.fillStyle='#111';g.beginPath();g.arc(17,-15,3,0,Math.PI*2);g.fill();g.fillStyle='#b48634';g.beginPath();g.moveTo(40,-6);g.lineTo(58,0);g.lineTo(40,5);g.fill();g.restore()}
function turtleDraw(x){g.save();g.translate(x,285);g.fillStyle='#676d42';g.beginPath();g.ellipse(0,0,39,25,0,0,Math.PI*2);g.fill();g.strokeStyle='#98935b';g.lineWidth=2;g.stroke();g.fillStyle='#777a49';g.beginPath();g.arc(40,2,14,0,Math.PI*2);g.fill();g.fillStyle='#15150f';g.beginPath();g.arc(44,-1,2,0,Math.PI*2);g.fill();for(const p of [[-24,20],[20,20]]){g.fillStyle='#777a49';g.beginPath();g.ellipse(p[0],p[1],10,6,0,0,Math.PI*2);g.fill()}g.restore()}
function gameDraw(){bg();g.strokeStyle='#77725e';g.lineWidth=3;g.strokeRect(42,70,285,245);for(let x=70;x<327;x+=32){g.beginPath();g.moveTo(x,70);g.lineTo(x,315);g.stroke()}bird();text('FILEMÓN',185,270,15,true);g.fillStyle='#746d4d';g.beginPath();g.ellipse(90,296,38,12,0,0,Math.PI*2);g.fill();for(let i=0;i<9;i++){g.fillStyle='#c7b052';g.beginPath();g.ellipse(68+(i%5)*10,288+Math.floor(i/5)*5,3,5,.4,0,Math.PI*2);g.fill()}text('SEMILLAS',90,330,11);if(seed){g.fillStyle='#d2bb50';g.beginPath();g.ellipse(seed.x,seed.y,6,10,.5,0,Math.PI*2);g.fill()}text('HAMBRE',45,365,12,false,'left');g.strokeStyle='#8b856d';g.strokeRect(110,352,215,15);g.fillStyle=hunger>70?'#d8c451':'#77725e';g.fillRect(112,354,Math.min(211,211*hunger/100),11);g.strokeStyle='#625f50';g.setLineDash([8,7]);g.beginPath();g.moveTo(365,290);g.lineTo(650,290);g.stroke();g.setLineDash([]);const tx=365+285*turtle/100;turtleDraw(tx);g.strokeStyle='#8b856d';g.lineWidth=4;g.strokeRect(648,160,58,150);text('SALIDA',677,145,12,true);text('RIESGO DE ESCAPE',370,365,12,false,'left');g.strokeRect(510,352,195,15);g.fillStyle=turtle>70?'#d8c451':'#77725e';g.fillRect(512,354,Math.min(191,191*turtle/100),11);if(hunger>73)text('FILEMÓN TIENE HAMBRE',185,43,13,true);if(turtle>73)text('¡LA TORTUGA SE ESCAPA!',525,43,13,true)}
function failDraw(){bg();g.fillStyle='rgba(80,18,12,.22)';g.fillRect(0,0,720,470);text('¡ROSTIZADA!',360,135,39,true);text('LA TORTUGA HA ESCAPADO',360,182,18,true);turtleDraw(470);text('FILEMÓN SIGUE ESPERANDO.',360,335,14);text('ARCHIVO 13 // INTENTO FALLIDO',360,395,12)}
function winDraw(){bg();text('ARCHIVO 13 DESBLOQUEADO',360,110,30,true);text('FILEMÓN ESTÁ A SALVO.',360,200,20,true);text('LA TORTUGA NO HA ESCAPADO.',360,245,18,true);bird();text('13 / 13',360,330,18,true);text('ROSTIZAME // BUENA VISTA',360,420,14,true)}
function reset(){elapsed=0;hunger=28;turtle=12;score=0;lives=3;seed=null;eat=0;marMsg=false;S.textContent=0;L.textContent=3}
function start(){audioOn();cancelAnimationFrame(raf);reset();run=true;intro.classList.add('hidden');end.classList.add('hidden');controls.classList.remove('hidden');hud.classList.remove('hidden');M.textContent='Alimentá a Filemón y evitá que escape la tortuga.';last=performance.now();gameDraw();raf=requestAnimationFrame(loop)}
function rostizada(){run=false;cancelAnimationFrame(raf);failSound();controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');endBtn.textContent='VOLVER A INTENTAR';M.textContent='¡ROSTIZADA! La tortuga escapó.';failDraw()}
function victory(){run=false;cancelAnimationFrame(raf);winSound();controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');endBtn.textContent='JUGAR DE NUEVO';M.textContent='Archivo 13-B desbloqueado.';winDraw()}
function loop(now){if(!run)return;const dt=Math.min((now-last)/1000,.04)||0;last=now;elapsed+=dt;if(!marMsg&&elapsed>=13){marMsg=true;M.textContent='MENSAJE RECIBIDO // MAR CHIQUITA — ¿Todo bien con Filemón?';chirp();}const d=1+elapsed/45+score/18;hunger+=7.2*d*dt;turtle+=(4+score*.18)*d*dt;eat=Math.max(0,eat-dt);if(seed){const dx=185-seed.x,dy=198-seed.y,dist=Math.hypot(dx,dy);if(dist<16){seed=null;eat=.32;chirp();M.textContent='Pip-pip. Filemón comió.'}else{const sp=470*dt;seed.x+=dx/dist*sp;seed.y+=dy/dist*sp}}if(turtle>=100){rostizada();return}if(hunger>=100){lives--;L.textContent=lives;hunger=32;M.textContent='Filemón necesitaba comida. Perdiste una vida.';if(lives<=0){run=false;controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');endBtn.textContent='VOLVER A INTENTAR';failSound();bg();text('ARCHIVO 13 // FALLIDO',360,180,29,true);text('FILEMÓN SE QUEDÓ SIN COMER',360,235,17,true);text('INTENTÁ NUEVAMENTE',360,310,14);return}}gameDraw();raf=requestAnimationFrame(loop)}
document.querySelector('#accept').addEventListener('click',start);document.querySelector('#restart').addEventListener('click',start);endBtn.addEventListener('click',start);
document.querySelector('#feed').addEventListener('click',()=>{audioOn();if(!run||seed)return;if(hunger<13){M.textContent='Filemón todavía no tiene hambre.';return}seed={x:90,y:288};hunger=Math.max(0,hunger-34);score++;S.textContent=score;M.textContent='La semilla va hacia Filemón…';if(score>=13)setTimeout(()=>{if(run)victory()},520)});
document.querySelector('#back').addEventListener('click',()=>{audioOn();if(!run)return;turtle=Math.max(2,turtle-25);hunger=Math.min(100,hunger+4);stepSound();M.textContent='La tortuga volvió a una posición segura.'});introDraw()})();
</script>
</body></html>
