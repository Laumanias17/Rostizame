<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BV // VISOR 13 V1</title><style>*{box-sizing:border-box}body{margin:0;background:#030607;color:#bff;font-family:monospace;overflow:hidden}#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:24px;text-align:center;pointer-events:none}.top{font-size:14px;letter-spacing:2px;text-shadow:0 0 8px #0ff}.ret{position:absolute;left:50%;top:50%;width:72%;height:62%;transform:translate(-50%,-50%);border:2px solid #7ff;border-radius:10px;box-shadow:0 0 20px #0ff5 inset,0 0 16px #0ff5}.ret:before,.ret:after{content:"";position:absolute;background:#7ff}.ret:before{width:20px;height:2px;left:50%;top:50%;transform:translate(-50%,-50%)}.ret:after{width:2px;height:20px;left:50%;top:50%;transform:translate(-50%,-50%)}#msg{margin:auto 0 20px;background:#001b1bcc;padding:12px;border:1px solid #4ff;font-size:16px}.start{position:fixed;inset:0;background:#020606;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:30px;z-index:5}.start h1{font-size:24px;letter-spacing:3px}.start p{max-width:340px;text-align:center;color:#9bb;line-height:1.5}.start button{pointer-events:auto;background:#062b2b;color:#dff;border:1px solid #5ff;padding:16px 22px;font:bold 16px monospace;border-radius:8px}.pulse{animation:p 1.3s infinite}@keyframes p{50%{opacity:.35;text-shadow:0 0 22px #0ff}}#thirteen{display:none;position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:100px;font-weight:bold;text-shadow:0 0 25px #0ff}</style></head><body><video id="cam" autoplay playsinline muted></video><div class="ui"><div class="top">BV // VISOR 13 · V1</div><div class="ret"></div><div id="thirteen" class="pulse">13</div><div id="msg">BUSCÁ LA TAPA · CENTRALA DENTRO DEL MARCO</div></div><div class="start" id="start"><h1>BV // VISOR 13</h1><p>Esta primera prueba activa la cámara. Apuntá a la tapa de ROSTIZAME que tenés abierta en la otra pantalla.</p><button id="go">ACTIVAR VISOR</button><small>La cámara requiere tu permiso.</small></div><script>const v=document.querySelector('#cam'),s=document.querySelector('#start'),m=document.querySelector('#msg'),n=document.querySelector('#thirteen');document.querySelector('#go').onclick=async()=>{try{let st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=st;s.style.display='none';setTimeout(()=>{m.textContent='PRUEBA DE CÁMARA ACTIVA // CENTRÁ ROSTIZAME';},700);setTimeout(()=>{m.textContent='BV // VISOR OPERATIVO';n.style.display='block';},5000)}catch(e){m.textContent='NO SE PUDO ABRIR LA CÁMARA';s.querySelector('p').textContent='No se pudo acceder a la cámara. Revisá el permiso del navegador.'}}</script></body></html>
