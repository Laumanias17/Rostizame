<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BV // VISOR 13 V3</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020606;color:#cfffff;font-family:monospace}.setup{position:fixed;inset:0;z-index:20;background:#020606;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}.setup h1{letter-spacing:3px}.setup p{max-width:390px;line-height:1.5;color:#a9caca}.btn{display:block;margin:10px auto;padding:15px 18px;border:1px solid #6ff;background:#073030;color:#dfffff;font:bold 15px monospace;border-radius:8px}.file{max-width:90%;margin:12px}.bar{width:min(360px,85vw);height:8px;border:1px solid #477;margin:12px}.fill{height:100%;width:0;background:#7ff}.hud{position:fixed;z-index:10;left:0;right:0;top:0;padding:18px;text-align:center;pointer-events:none;text-shadow:0 0 10px #0ff}.bottom{top:auto;bottom:18px}.hidden{display:none!important}</style></head><body>
<div id="setup" class="setup"><h1>BV // VISOR 13</h1><p>Elegí la imagen de la tapa de ROSTIZAME desde tu teléfono. El visor la analizará y después abrirá la cámara. La imagen no se sube a ningún servidor.</p><input id="file" class="file" type="file" accept="image/*" style="position:absolute;left:-9999px"><button id="pick" class="btn">SELECCIONAR IMAGEN DE LA TAPA</button><div id="chosen" style="margin:8px;color:#9cc">NINGUNA IMAGEN SELECCIONADA</div><button id="compile" class="btn">PREPARAR TAPA</button><div class="bar"><div id="fill" class="fill"></div></div><div id="status">ESPERANDO IMAGEN</div></div>
<div id="top" class="hud hidden">BV // VISOR 13 · BUSCÁ LA TAPA</div><div id="bottom" class="hud bottom hidden">OBJETIVO NO DETECTADO</div><div id="ar"></div>
<script>
const file=document.querySelector('#file'),pick=document.querySelector('#pick'),chosen=document.querySelector('#chosen'),btn=document.querySelector('#compile'),status=document.querySelector('#status'),fill=document.querySelector('#fill');pick.onclick=()=>file.click();file.onchange=()=>{chosen.textContent=file.files[0]?'✓ '+file.files[0].name:'NINGUNA IMAGEN SELECCIONADA';status.textContent=file.files[0]?'TAPA SELECCIONADA // TOCÁ PREPARAR TAPA':'ESPERANDO IMAGEN'};
const loadImage=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(f)});
btn.onclick=async()=>{if(!file.files[0]){status.textContent='ELEGÍ PRIMERO LA TAPA';return}btn.disabled=true;status.textContent='ANALIZANDO TAPA…';try{
 const img=await loadImage(file.files[0]); const compiler=new window.MINDAR.IMAGE.Compiler();
 await compiler.compileImageTargets([img],p=>{fill.style.width=p+'%';status.textContent='ANALIZANDO // '+p.toFixed(0)+'%'});
 const buffer=await compiler.exportData(); const url=URL.createObjectURL(new Blob([buffer]));
 status.textContent='OBJETIVO LISTO'; startAR(url);
}catch(e){console.error(e);status.textContent='ERROR AL PREPARAR LA TAPA';btn.disabled=false}};
function startAR(url){document.querySelector('#setup').classList.add('hidden');document.querySelector('#top').classList.remove('hidden');document.querySelector('#bottom').classList.remove('hidden');
 const ar=document.querySelector('#ar'); ar.innerHTML=`<a-scene mindar-image="imageTargetSrc: ${url}; autoStart: true; uiLoading: no; uiScanning: no; uiError: no" color-space="sRGB" renderer="colorManagement:true,physicallyCorrectLights" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-circle radius=".18" color="#00ffff" opacity=".18" position="0 .08 .02" animation="property:scale;from:.75 .75 .75;to:1.25 1.25 1.25;dur:900;dir:alternate;loop:true"></a-circle><a-text value="13" align="center" color="#dfffff" width="2.2" position="0 .08 .04" animation="property:scale;from:1 1 1;to:1.18 1.18 1.18;dur:900;dir:alternate;loop:true"></a-text><a-text value="BV // OBJETO IDENTIFICADO" align="center" color="#7fffff" width="1.35" position="0 -.48 .04"></a-text></a-entity></a-scene>`;
 setTimeout(()=>{const t=document.querySelector('#target'),b=document.querySelector('#bottom');if(t){t.addEventListener('targetFound',()=>{b.textContent='ROSTIZAME // ARCHIVO 13 DETECTADO';navigator.vibrate?.(60)});t.addEventListener('targetLost',()=>b.textContent='OBJETIVO PERDIDO // BUSCÁ LA TAPA')}},800);
}
</script></body></html>
