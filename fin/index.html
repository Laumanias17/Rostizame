<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIN DEL MUNDO PUERTA A PUERTA</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:ui-monospace,monospace}.w{max-width:720px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;font-weight:900}.sub{font-size:12px;color:#aaa}.room{height:470px;position:relative;overflow:hidden;border:1px solid #555;border-radius:14px;background:#080808}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.bubble{position:absolute;z-index:4;left:42%;top:80px;max-width:52%;padding:14px;background:#fff;color:#111;border:3px solid #111;border-radius:24px;font:900 15px Arial;text-align:center;opacity:0;transform:scale(.75);transition:.18s}.bubble.show{opacity:1;transform:scale(1)}.bubble:after{content:"";position:absolute;left:15%;bottom:-19px;border:10px solid transparent;border-top-color:#fff}.impact{position:absolute;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;font:900 30px Arial;text-shadow:3px 3px #000;pointer-events:none;opacity:0}.impact.go{animation:pop .65s}@keyframes pop{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1)}}.msg{text-align:center;min-height:60px;padding:10px;font-weight:900}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button{min-height:60px;border-radius:12px;border:1px solid #aaa;background:#242424;color:#fff;font:900 15px monospace}.dog{grid-column:1/3;background:#4b3824!important}.hide{display:none!important}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}</style></head><body><main class="w"><div class="top"><div>BV // FIN DEL MUNDO PUERTA A PUERTA<div class="sub">ARCHIVO 13 · MANTENER CERRADO</div></div><div id="hud">0/13 · ♥♥♥ · 🐕3</div></div><div id="room" class="room"><img class="scene" src="./ChatGPT%20Image%2018%20sept%202026%2C%2012_33_11%20p.m..png?v=16"><div id="bubble" class="bubble"></div><div id="impact" class="impact"></div></div><div id="msg" class="msg">TOC TOC.</div><div class="buttons"><button id="start" style="grid-column:1/3">ATENDER LA PUERTA</button><button id="yes" class="hide">DEJAR PASAR</button><button id="no" class="hide">RECHAZAR</button><button id="dog" class="dog hide">🐕 SOLTAR AL PERRO · 3</button></div></main><script>(()=>{const $=s=>document.querySelector(s),B=$('#bubble'),M=$('#msg'),H=$('#hud'),R=$('#room'),I=$('#impact'),S=$('#start'),Y=$('#yes'),N=$('#no'),D=$('#dog');const pool=[['ORE CON NOSOTROS',0],['SU PEDIDO',1],['¿QUIERE SER PARTE DE LA RESURRECCIÓN?',0],['VECINA — SE LE CAYÓ ESTO',1],['BUENA NUEVA',0],['CORREO — PAQUETE',1],['¿PODEMOS HABLAR?',0],['TÉCNICO — VISITA PROGRAMADA',1],['EL FIN ESTÁ CERCA',0],['DELIVERY',1],['TENEMOS UN MENSAJE',0],['VECINO — SUS LLAVES',1],['DELIVERY — TRAEMOS LA BUENA NUEVA',0],['CENSO DE HUMANIDAD',0],['FILEMÓN NECESITA SEMILLAS',1],['ÚLTIMO AVISO',0],['PIZZA',1],['¿TIENE UN MINUTO?',0]];let deck=[],cur,n=0,l=3,d=3,run=false,t,a;const doglines=['¡ÑAC! // PANTALÓN CAPTURADO','¡GUAU! // VISITANTE EN RETIRADA','MORDIDA ADMINISTRATIVA','PERÍMETRO DESPEJADO'];function sound(f,dur=.1){if(!a)return;let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.stop(a.currentTime+dur)}function hud(){H.textContent=n+'/13 · '+'♥'.repeat(l)+'♡'.repeat(3-l)+' · 🐕'+d;D.textContent='🐕 SOLTAR AL PERRO · '+d}function fx(txt){I.textContent=txt;I.classList.remove('go');void I.offsetWidth;I.classList.add('go')}function next(){if(!run)return;cur=deck.pop();B.textContent=cur[0];B.classList.add('show');M.textContent=n>8?'DECIDÍ RÁPIDO.':'¿QUIÉN ESTÁ DEL OTRO LADO?';sound(150,.08);setTimeout(()=>sound(120,.08),130);clearTimeout(t);t=setTimeout(()=>choose(null),Math.max(1700,3900-n*150))}function choose(v){if(!run)return;clearTimeout(t);B.classList.remove('show');if(v===cur[1]){n++;M.textContent=v?'ENTRADA AUTORIZADA ✓':'RECHAZADO ✓';fx(v?'PASE':'CLAC');sound(700,.08)}else{l--;M.textContent=v===null?'DEMASIADO TARDE':'DECISIÓN INCORRECTA';fx('⚠');R.classList.add('shake');setTimeout(()=>R.classList.remove('shake'),260);sound(70,.3);if(l<=0)return lose()}hud();if(n>=13)return win();setTimeout(next,650)}function dog(){if(!run||d<1)return;clearTimeout(t);d--;n++;B.classList.remove('show');let x=doglines[Math.floor(Math.random()*doglines.length)];M.textContent=x;fx('🐕💨  ¡ÑAC!');sound(110,.18);setTimeout(()=>sound(80,.16),150);if(navigator.vibrate)navigator.vibrate([40,50,80]);hud();if(n>=13)return setTimeout(win,500);setTimeout(next,850)}function lose(){run=false;B.classList.remove('show');Y.classList.add('hide');N.classList.add('hide');D.classList.add('hide');M.textContent='¡ROSTIZADA! // EL FIN ENTRÓ';fx('EL FIN');S.textContent='OTRA VEZ';S.classList.remove('hide')}function win(){run=false;B.classList.remove('show');Y.classList.add('hide');N.classList.add('hide');D.classList.add('hide');M.textContent='13 / 13 // SILENCIO';setTimeout(()=>{M.textContent='TOC TOC';sound(100,.12)},1300);setTimeout(()=>{M.textContent='EL FIN YA ESTABA ADENTRO. // BV // ARCHIVO 13';fx('TOC TOC');sound(55,.5);S.textContent='OTRA VEZ';S.classList.remove('hide')},2600)}function start(){if(!a){let A=window.AudioContext||window.webkitAudioContext;if(A)a=new A()}if(a&&a.state==='suspended')a.resume();deck=[...pool].sort(()=>Math.random()-.5).slice(0,13);n=0;l=3;d=3;run=true;hud();S.classList.add('hide');Y.classList.remove('hide');N.classList.remove('hide');D.classList.remove('hide');M.textContent='DING DONG';sound(650,.1);setTimeout(()=>sound(850,.18),120);setTimeout(next,500)}S.onclick=start;Y.onclick=()=>choose(1);N.onclick=()=>choose(0);D.onclick=dog})();</script></body></html>
