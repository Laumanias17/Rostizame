<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROSTIZAME // ATENCIÓN</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font-family:ui-monospace,monospace}.w{max-width:900px;margin:auto;padding:10px}.hud{display:flex;justify-content:space-between;gap:8px;font-weight:900;margin-bottom:7px}.small{font-size:11px;color:#aaa}.scene{position:relative;aspect-ratio:1536/1024;overflow:hidden;border:1px solid #555;border-radius:12px;background:#111}.bg{width:100%;height:100%;object-fit:contain;display:block}.hot{position:absolute;border:2px solid transparent;background:transparent;border-radius:12px;cursor:pointer}.hot.on{border-color:#fff;animation:pulse .42s infinite alternate;background:#ffffff12}.hot.on:after{content:"!";position:absolute;right:-8px;top:-10px;width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#d22;color:#fff;font-weight:900}.hot:active{background:#fff4}@keyframes pulse{to{box-shadow:0 0 18px #fff}}#pc{left:0;top:48%;width:32%;height:39%}#phone{left:43%;top:57%;width:14%;height:28%}#watch{left:58%;top:68%;width:10%;height:18%}#tablet{left:70%;top:66%;width:17%;height:27%}#tv{left:72%;top:10%;width:27%;height:34%}#speaker{left:88%;top:42%;width:11%;height:20%}#camera{left:51%;top:1%;width:12%;height:17%}#bird{left:46%;top:25%;width:14%;height:24%}#window{left:22%;top:5%;width:22%;height:38%}#bell{left:0;top:10%;width:9%;height:30%}.msg{text-align:center;min-height:52px;padding:9px;font-weight:900}.start{width:100%;min-height:55px;border:1px solid #aaa;border-radius:12px;background:#20242b;color:#fff;font:900 15px monospace}.alarm{animation:shake .18s}@keyframes shake{50%{transform:translateX(4px)}}@media(max-width:500px){.w{padding:5px}.hud{font-size:12px}.msg{font-size:13px}}</style></head><body><main class="w"><div class="hud"><div>BV // SATURACIÓN<div class="small">ARCHIVO 13 · TODO QUIERE TU ATENCIÓN</div></div><div id="score">0/13 · ♥♥♥</div></div><div id="scene" class="scene"><img class="bg" src="./ChatGPT%20Image%2018%20sept%202026%2C%2003_51_45%20p.m..png?v=24" alt=""><button class="hot" id="pc" aria-label="PC"></button><button class="hot" id="phone" aria-label="Celular"></button><button class="hot" id="watch" aria-label="Reloj"></button><button class="hot" id="tablet" aria-label="Tablet"></button><button class="hot" id="tv" aria-label="TV"></button><button class="hot" id="speaker" aria-label="Parlante"></button><button class="hot" id="camera" aria-label="Cámara"></button><button class="hot" id="bird" aria-label="Filemón"></button><button class="hot" id="window" aria-label="Ventana"></button><button class="hot" id="bell" aria-label="Timbre"></button></div><div id="msg" class="msg">Todo está en silencio. Por ahora.</div><button id="start" class="start">CONECTAR TODO</button></main><script>(()=>{const ids=['pc','phone','watch','tablet','tv','speaker','camera','bird','window','bell'],junk=new Set(['tv','speaker','tablet','pc']),labels={pc:['PC // ACTUALIZACIÓN DISPONIBLE','PC // 7 CORREOS NUEVOS','PC // DOCUMENTO COMPARTIDO: ROSTIZAME_FINAL.pdf','PC // MEET DE POESÍA','PC // ALMACENAMIENTO LLENO'],phone:['CELULAR // LLAMADA ENTRANTE','CELULAR // MARIO LOBIZÓN LLAMA','CELULAR // HERMANA','CELULAR // BILLETERA VIRTUAL: MOVIMIENTO','CELULAR // 13 MENSAJES SIN LEER','CELULAR // NÚMERO DESCONOCIDO'],watch:['RELOJ // LEVANTATE','RELOJ // RESPIRÁ','RELOJ // OBJETIVO INCOMPLETO','RELOJ // LLEVÁS 13 MINUTOS SENTADA'],tablet:['TABLET // LIBRERÍA HOJARASCA LLAMA','TABLET // 7 MENSAJES NUEVOS','TABLET // 3 NOTIFICACIONES','TABLET // ALGUIEN TE ETIQUETÓ','TABLET // ¿QUERÉS ACTIVAR MÁS AVISOS?'],tv:['TV // ¿SIGUES AHÍ?','TV // RECOMENDADO PARA VOS','TV // SIGUIENTE EPISODIO EN 5…','TV // NO APAGUES LA PANTALLA'],speaker:['PARLANTE // NO ENTENDÍ','PARLANTE // ¿PODÉS REPETIR?','PARLANTE // CREÍ ESCUCHAR MI NOMBRE','PARLANTE // REPRODUCIENDO ALGO QUE NO PEDISTE'],camera:['CÁMARA // MOVIMIENTO DETECTADO','CÁMARA // PERSONA DETECTADA','CÁMARA // TE ESTÁ MIRANDO','CÁMARA // MOVIMIENTO: VENTANA'],bird:['FILEMÓN // QUIERE ATENCIÓN','FILEMÓN // PÍO','FILEMÓN // NO ES UNA APP','FILEMÓN // SIGUE AHÍ'],window:['VENTANA // EVANGELISTAS','VENTANA // EVANGELISTAS OTRA VEZ','VENTANA // SIGUEN AHÍ','VENTANA // ¿TIENE UN MINUTO?','VENTANA // SOLO UN MINUTO MÁS'],bell:['TIMBRE // ALGUIEN ESTÁ AHÍ','TIMBRE // TOC TOC','TIMBRE // OTRA VEZ','TIMBRE // NO SE FUERON']},tones={pc:310,phone:720,watch:480,tablet:590,tv:250,speaker:390,camera:900,bird:1100,window:180,bell:660};let active=new Set,score=0,lives=3,run=false,timer,audio,birdSecret=false;const $=s=>document.querySelector(s),M=$('#msg'),H=$('#score'),S=$('#start'),SC=$('#scene');function snd(id){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=tones[id];g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.13);o.stop(audio.currentTime+.13)}function hud(){let a=score>=12?'███/13':score>=10?score+'/13 ⚠':score+'/13';H.textContent=a+' · '+'♥'.repeat(lives)+'♡'.repeat(3-lives)}function phrase(id){let a=labels[id];return a[Math.floor(Math.random()*a.length)]}function activate(){if(!run)return;let free=ids.filter(x=>!active.has(x));if(!free.length)return;let id=free[Math.floor(Math.random()*free.length)],txt=phrase(id);active.add(id);$('#'+id).dataset.txt=txt;$('#'+id).classList.add('on');M.textContent=txt;snd(id);if(navigator.vibrate)navigator.vibrate(25);let limit=Math.max(1500,3600-score*120);setTimeout(()=>{if(run&&active.has(id)){active.delete(id);$('#'+id).classList.remove('on');lives--;hud();M.textContent='NO ATENDISTE // '+($('#'+id).dataset.txt||phrase(id));SC.classList.add('alarm');setTimeout(()=>SC.classList.remove('alarm'),200);if(lives<=0)lose()}},limit)}function tap(id){if(!run)return;if(id==='bird'&&!active.has(id)&&birdSecret){birdSecret=false;M.textContent='FILEMÓN NO ERA UNA NOTIFICACIÓN.';snd('bird');return}if(!active.has(id)){M.textContent='ESO NO ESTABA SONANDO.';return}active.delete(id);$('#'+id).classList.remove('on');if(junk.has(id)){lives--;hud();M.textContent='NO TODO MERECE TU ATENCIÓN // '+($('#'+id).dataset.txt||phrase(id));snd(65);if(lives<=0)return lose();return}score++;hud();snd(id);M.textContent='ATENDIDO ✓ // '+($('#'+id).dataset.txt||phrase(id));if(score>=13)return win();if(score===6)M.textContent='AHORA TODO QUIERE ALGO.';if(score===9)setTimeout(()=>{if(run)M.textContent='¿SEGUÍS ELIGIENDO VOS?'},350)}function loop(){if(!run)return;activate();if(score>3&&Math.random()<.65)setTimeout(activate,260);if(score>7&&Math.random()<.7)setTimeout(activate,500);if(score>9&&Math.random()<.45)setTimeout(activate,720);if(Math.random()<.12&&!active.has('bird')){birdSecret=true;snd('bird');M.textContent='PÍO.';setTimeout(()=>birdSecret=false,1100)}timer=setTimeout(loop,Math.max(480,1450-score*60))}function clear(){active.forEach(id=>$('#'+id).classList.remove('on'));active.clear();clearTimeout(timer)}function lose(){run=false;clear();M.textContent='¡ROSTIZADA! // DEMASIADAS NOTIFICACIONES';S.textContent='RECONECTAR';S.style.display='block'}function win(){run=false;clear();M.textContent='13 / 13 // SILENCIO';setTimeout(()=>{M.textContent='📱 1 NOTIFICACIÓN';snd('phone')},1400);setTimeout(()=>{M.textContent='¿POR QUÉ ATENDÉS TODO? // ROSTIZAME // BUENA VISTA';S.textContent='OTRA VEZ';S.style.display='block'},2800)}function start(){if(!audio){let A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume();clear();score=0;lives=3;run=true;hud();S.style.display='none';M.textContent='CONECTADO. ATENDÉ LO IMPORTANTE. IGNORÁ EL RUIDO.';setTimeout(loop,500)}ids.forEach(id=>$('#'+id).addEventListener('click',()=>tap(id)));S.addEventListener('click',start)})();</script></body></html>
