<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROSTIZAME — Fin del mundo puerta a puerta</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:monospace}.w{max-width:720px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;font-weight:900}.sub{font-size:12px;color:#aaa}.room{height:470px;margin-top:10px;position:relative;overflow:hidden;border:1px solid #555;border-radius:14px;background:#111}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0}.outside{position:absolute;left:37%;top:62px;width:26%;height:335px;background:transparent;display:none;align-items:center;justify-content:center;text-align:center;font-weight:900}.door{z-index:3;position:absolute;left:32%;top:52px;width:30%;height:365px;background:linear-gradient(90deg,rgba(70,38,18,.55),rgba(120,72,35,.22));border:1px solid rgba(255,190,110,.22);transform-origin:left center;transform:perspective(650px) rotateY(-8deg);transition:transform .08s linear;pointer-events:none}.door.open{transform:perspective(650px) rotateY(-64deg)}.knob{position:absolute;right:16px;top:52%;width:14px;height:14px;border-radius:50%;background:#d1ad57}.bell{display:none}.meter{height:8px;background:#222;margin-top:8px;border-radius:6px;overflow:hidden}.fill{height:100%;background:#ccc;width:0;transition:.2s}.msg{text-align:center;min-height:62px;padding:12px;font-weight:900}.ctrl{text-align:center}button{min-height:58px;border:1px solid #aaa;border-radius:12px;background:#242424;color:#fff;font:900 15px monospace;padding:0 24px}.hide{display:none}.doom{font-size:29px;color:#e2bd59}.bubble{position:absolute;z-index:8;max-width:54%;padding:13px 16px;background:#fff;color:#111;border:3px solid #111;border-radius:24px;font:900 15px/1.15 Arial,sans-serif;text-align:center;filter:drop-shadow(0 4px 4px #0008);left:43%;top:115px;transform:scale(.75);opacity:0;transition:.2s}.bubble.show{transform:scale(1);opacity:1}.bubble:after{content:"";position:absolute;left:18%;bottom:-20px;border:11px solid transparent;border-top-color:#fff;transform:rotate(12deg)}</style></head><body><main class="w"><div class="top"><div>BV // FIN DEL MUNDO PUERTA A PUERTA<div class="sub">ARCHIVO 13 · MANTENER CERRADO</div></div><div id="hud">0 / 13</div></div><div class="meter"><div id="fill" class="fill"></div></div><div class="room"><img class="scene" src="./ChatGPT%20Image%2018%20sept%202026%2C%2012_16_45%20p.m..png?v=8" alt=""><div class="outside"><span id="out">...</span></div><div id="door" class="door"><i class="knob"></i></div><div class="bell">TIMBRE</div><div id="bubble" class="bubble"></div></div><div id="msg" class="msg">Hay algo del otro lado.</div><div class="ctrl"><button id="start">ESCUCHAR</button><button id="close" class="hide">CERRAR LA PUERTA</button><button id="again" class="hide">OTRA VEZ</button></div></main><script>(()=>{const D=document.querySelector('#door'),O=document.querySelector('#out'),M=document.querySelector('#msg'),H=document.querySelector('#hud'),F=document.querySelector('#fill'),S=document.querySelector('#start'),C=document.querySelector('#close'),A=document.querySelector('#again'),B=document.querySelector('#bubble');let n=0,run=false,t,audio,hold=false,op=0,raf=0;const lines=['ORE CON NOSOTROS','¿QUIERE SER PARTE DE LA RESURRECCIÓN?','BUENA NUEVA','¿TIENE UN MINUTO?','EL FIN ESTÁ CERCA','TENEMOS UN MENSAJE','¿PODEMOS HABLAR?','LA RESURRECCIÓN','BUENA NUEVA','HAY ALGO QUE DEBE SABER','ORE CON NOSOTROS','EL TIEMPO SE ACABA','ÚLTIMO AVISO'];function snd(f,d=.12){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}function bark(){if(!audio)return;let now=audio.currentTime;[0,.13,.28].forEach((z,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(i%2?150:115,now+z);o.frequency.exponentialRampToValueAtTime(75,now+z+.1);g.gain.setValueAtTime(.001,now+z);g.gain.exponentialRampToValueAtTime(.035,now+z+.015);g.gain.exponentialRampToValueAtTime(.001,now+z+.12);o.connect(g);g.connect(audio.destination);o.start(now+z);o.stop(now+z+.13)})}function bell(){snd(880,.09);setTimeout(()=>snd(660,.18),90)}function knocks(){snd(95,.08);setTimeout(()=>snd(85,.08),150);setTimeout(()=>snd(105,.09),310)}function animate(){if(!run)return;op+=hold?-0.035:0.012+Math.min(n,12)*0.0007;op=Math.max(0,Math.min(1,op));D.style.transform='perspective(650px) rotateY('+(-8-op*58)+'deg)';if(op>=1)return miss();raf=requestAnimationFrame(animate)}function knock(){if(!run)return;hold=false;op=.22;cancelAnimationFrame(raf);raf=requestAnimationFrame(animate);O.textContent='';B.textContent=lines[n];B.classList.add('show');M.textContent=n%3?'ALGO INTENTA ENTRAR':'TOC TOC // CERRÁ LA PUERTA';if(n%3===1)bell();else knocks();if(n===2||n===6||n===10)setTimeout(bark,220);t=setTimeout(()=>{if(run&&op>.92)miss()},Math.max(1800,3200-n*70))}function close(){if(!run)return;clearTimeout(t);cancelAnimationFrame(raf);hold=false;op=0;D.style.transform='perspective(650px) rotateY(-8deg)';B.classList.remove('show');n++;H.textContent=n+' / 13';F.style.width=n/13*100+'%';snd(760,.08);M.textContent='PUERTA CERRADA ✓';if(n>=13)return win();setTimeout(knock,450+Math.random()*700)}function miss(){run=false;B.classList.remove('show');D.classList.add('open');O.innerHTML='<span class="doom">EL FIN<br>ENTRÓ</span>';M.textContent='¡ROSTIZADA!';C.classList.add('hide');A.classList.remove('hide');snd(65,.5)}function win(){run=false;B.classList.remove('show');C.classList.add('hide');M.textContent='13 / 13 // SILENCIO';O.textContent='...';setTimeout(()=>{D.classList.remove('open');M.textContent='PARECE QUE TERMINÓ.'},700);setTimeout(()=>{snd(95,.18);M.textContent='TOC TOC'},1800);setTimeout(()=>{O.innerHTML='<span class="doom">EL FIN<br>YA ESTABA<br>ADENTRO</span>';D.classList.add('open');M.textContent='BV // ARCHIVO 13';A.classList.remove('hide');if(navigator.vibrate)navigator.vibrate([70,90,150])},2800)}function start(){if(!audio){let X=window.AudioContext||window.webkitAudioContext;if(X)audio=new X()}if(audio&&audio.state==='suspended')audio.resume();n=0;run=true;H.textContent='0 / 13';F.style.width=0;O.textContent='...';B.classList.remove('show');D.classList.remove('open');S.classList.add('hide');A.classList.add('hide');C.classList.remove('hide');M.textContent='ESCUCHÁ.';setTimeout(knock,650)}C.onpointerdown=e=>{if(!run)return;e.preventDefault();hold=true;snd(150,.05)};C.onpointerup=e=>{if(!run)return;e.preventDefault();hold=false;if(op<.08)close()};C.onpointercancel=()=>hold=false;S.onclick=start;A.onclick=start})();</script></body></html>
