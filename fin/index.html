<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROSTIZAME — Fin del mundo puerta a puerta</title><style>*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font-family:monospace}.w{max-width:720px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;font-weight:900}.sub{font-size:12px;color:#aaa}.room{height:470px;margin-top:10px;position:relative;overflow:hidden;border:1px solid #555;border-radius:14px;background:radial-gradient(circle at 50% 40%,#292725,#101010 65%)}.outside{position:absolute;left:37%;top:62px;width:26%;height:335px;background:#030303;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900}.door{position:absolute;left:36%;top:55px;width:28%;height:350px;background:linear-gradient(90deg,#342117,#68432b);border:8px solid #211711;transform-origin:left;transition:transform .22s}.door.open{transform:perspective(520px) rotateY(-58deg)}.knob{position:absolute;right:16px;top:52%;width:14px;height:14px;border-radius:50%;background:#d1ad57}.bell{position:absolute;right:20%;top:160px;border:1px solid #777;padding:7px;background:#222}.meter{height:8px;background:#222;margin-top:8px;border-radius:6px;overflow:hidden}.fill{height:100%;background:#ccc;width:0;transition:.2s}.msg{text-align:center;min-height:62px;padding:12px;font-weight:900}.ctrl{text-align:center}button{min-height:58px;border:1px solid #aaa;border-radius:12px;background:#242424;color:#fff;font:900 15px monospace;padding:0 24px}.hide{display:none}.doom{font-size:29px;color:#e2bd59}</style></head><body><main class="w"><div class="top"><div>BV // FIN DEL MUNDO PUERTA A PUERTA<div class="sub">ARCHIVO 13 · MANTENER CERRADO</div></div><div id="hud">0 / 13</div></div><div class="meter"><div id="fill" class="fill"></div></div><div class="room"><div class="outside"><span id="out">...</span></div><div id="door" class="door"><i class="knob"></i></div><div class="bell">TIMBRE</div></div><div id="msg" class="msg">Hay algo del otro lado.</div><div class="ctrl"><button id="start">ESCUCHAR</button><button id="close" class="hide">CERRAR LA PUERTA</button><button id="again" class="hide">OTRA VEZ</button></div></main><script>(()=>{const D=document.querySelector('#door'),O=document.querySelector('#out'),M=document.querySelector('#msg'),H=document.querySelector('#hud'),F=document.querySelector('#fill'),S=document.querySelector('#start'),C=document.querySelector('#close'),A=document.querySelector('#again');let n=0,run=false,t,audio;const lines=['TOC TOC','TENEMOS UN MENSAJE','¿TIENE UN MINUTO?','EL FIN ESTÁ CERCA','DING DONG','TRAEMOS BUENAS NOTICIAS','TOC TOC','¿PODEMOS HABLAR?','HAY ALGO QUE DEBE SABER','DING DONG','EL TIEMPO SE ACABA','TOC TOC','ÚLTIMO AVISO'];function snd(f,d=.12){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}function knock(){if(!run)return;D.classList.add('open');O.textContent=lines[n];M.textContent=n%3?'ALGO INTENTA ENTRAR':'TOC TOC // CERRÁ LA PUERTA';snd(n%2?380:105,.16);t=setTimeout(miss,Math.max(1050,2300-n*70))}function close(){if(!run||!D.classList.contains('open'))return;clearTimeout(t);D.classList.remove('open');n++;H.textContent=n+' / 13';F.style.width=n/13*100+'%';snd(760,.08);M.textContent='PUERTA CERRADA ✓';if(n>=13)return win();setTimeout(knock,450+Math.random()*700)}function miss(){run=false;D.classList.add('open');O.innerHTML='<span class="doom">EL FIN<br>ENTRÓ</span>';M.textContent='¡ROSTIZADA!';C.classList.add('hide');A.classList.remove('hide');snd(65,.5)}function win(){run=false;C.classList.add('hide');M.textContent='13 / 13 // SILENCIO';O.textContent='...';setTimeout(()=>{D.classList.remove('open');M.textContent='PARECE QUE TERMINÓ.'},700);setTimeout(()=>{snd(95,.18);M.textContent='TOC TOC'},1800);setTimeout(()=>{O.innerHTML='<span class="doom">EL FIN<br>YA ESTABA<br>ADENTRO</span>';D.classList.add('open');M.textContent='BV // ARCHIVO 13';A.classList.remove('hide');if(navigator.vibrate)navigator.vibrate([70,90,150])},2800)}function start(){if(!audio){let X=window.AudioContext||window.webkitAudioContext;if(X)audio=new X()}if(audio&&audio.state==='suspended')audio.resume();n=0;run=true;H.textContent='0 / 13';F.style.width=0;O.textContent='...';D.classList.remove('open');S.classList.add('hide');A.classList.add('hide');C.classList.remove('hide');M.textContent='ESCUCHÁ.';setTimeout(knock,650)}S.onclick=start;C.onclick=close;A.onclick=start})();</script></body></html>
