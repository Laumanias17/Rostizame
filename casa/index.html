<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROSTIZAME // CASA</title><style>*{box-sizing:border-box}body{margin:0;background:#07111b;color:#fff;font-family:system-ui;text-align:center}header{padding:9px;font-weight:900}.sub{font-size:12px;opacity:.8}.hud{font-size:18px}.scene{position:relative;width:min(100vw,960px);margin:auto}.scene img{display:block;width:100%}.hot{position:absolute;border:0;background:transparent;border-radius:50%}.hot.found{border:3px solid #55f6ff;background:#42dff533;box-shadow:0 0 18px #55f6ff;pointer-events:none}.msg{min-height:45px;padding:8px;font-weight:800}.btn{padding:11px 20px;border:1px solid #6feeff;border-radius:9px;background:#092638;color:white;font-weight:900;margin:6px}.hide{display:none}footer{font-size:11px;opacity:.7;padding:7px}</style></head><body><header>BV // ARCHIVO 13<div class="sub">AQUÍ HAREMOS NUESTRA CASA</div></header><div class="hud" id="hud">REFERENCIAS 0/13</div><button class="btn" id="start">ENTRAR A LA CASA</button><div class="scene" id="scene"><img src="./ChatGPT%20Image%2019%20sept%202026%2C%2002_02_19%20p.m..png"><div id="spots"></div></div><div class="msg" id="msg">Hay trece referencias del poema. Encontralas todas.</div><button class="btn hide" id="again">BUSCAR OTRA VEZ</button><footer>ROSTIZAME // BUENA VISTA</footer><script>const refs=[['ESTACA',50,75,8,12],['TIAMAT',39,80,11,12],['CARNE',45,57,8,9],['GALLO DE RIÑA',71,66,7,9],['DOGO',62,68,8,10],['CUERVO',25,34,7,9],['NUDOS',32,52,8,10],['MINECRAFT',76,37,10,10],['TRÍCEPS',54,38,9,10],['DRAGON BALL',83,34,7,9],['ESTÉTICA',66,48,9,10],['BIBLIA',18,50,8,10],['NUBE',88,45,7,9]];let active=false,found=0;const S=document.querySelector('#spots'),M=document.querySelector('#msg'),H=document.querySelector('#hud'),B=document.querySelector('#start'),A=document.querySelector('#again');function build(){S.innerHTML='';refs.forEach(r=>{let b=document.createElement('button');b.className='hot';b.style.left=(r[1]-r[3]/2)+'%';b.style.top=(r[2]-r[4]/2)+'%';b.style.width=r[3]+'%';b.style.height=r[4]+'%';b.onclick=()=>hit(b,r[0]);S.appendChild(b)})}function hit(b,n){if(!active||b.classList.contains('found'))return;b.classList.add('found');found++;H.textContent='REFERENCIAS '+found+'/13';M.textContent='REFERENCIA ENCONTRADA // '+n;if(navigator.vibrate)navigator.vibrate(25);if(found===13){active=false;setTimeout(()=>{M.textContent='13 / 13 // LA CASA ESTÁ COMPLETA. // ARCHIVO 13 DESBLOQUEADO';A.classList.remove('hide')},500)}}B.onclick=()=>{active=true;found=0;build();H.textContent='REFERENCIAS 0/13';M.textContent='BUSCÁ EN LA CASA. EL POEMA ES LA PISTA.';B.classList.add('hide')};A.onclick=()=>{active=true;found=0;build();H.textContent='REFERENCIAS 0/13';M.textContent='LAS REFERENCIAS SIGUEN AHÍ.';A.classList.add('hide')};build();</script></body></html>
