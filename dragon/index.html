<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>ROSTIZAME — Archivo Dragón</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#e8edf4;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.k{font-weight:900;letter-spacing:.12em}.sub,.hint{font-size:12px;color:#9aa4b3}.screen{margin-top:12px;border:1px solid #3d4655;border-radius:14px;overflow:hidden;background:#0c1018}canvas{display:block;width:100%;height:auto;touch-action:none}.msg{text-align:center;min-height:50px;padding:13px 4px}.center{display:flex;justify-content:center;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:auto}button{min-height:56px;border:1px solid #586579;border-radius:12px;background:#141b27;color:#eef4ff;padding:9px;font:700 14px inherit}button.primary{background:#d6c44e;color:#12130d;border-color:#d6c44e}.hidden{display:none!important}.hint{text-align:center;margin-top:12px;line-height:1.4}</style></head>
<body><main class="wrap"><div class="top"><div><div class="k">BV // ARCHIVO DRAGÓN</div><div class="sub">PROTOCOLO 13 · CONEXIÓN ACTIVA</div></div><div id="hud" class="hidden">OLEADA <b id="wave">1</b>/13 · ⚡ <b id="load">0</b>%</div></div><div class="screen"><canvas id="game" width="720" height="470"></canvas></div><div id="msg" class="msg">Se ha detectado una conexión no autorizada.</div><div id="intro" class="center"><button id="accept" class="primary">MANTENER LA CONEXIÓN</button></div><div id="controls" class="hidden"><div class="actions"><button id="left">◀ MOVER TABLET</button><button id="right">MOVER TABLET ▶</button></div><div class="center"><button id="shield" class="primary">▣ BLOQUEAR</button></div></div><div id="end" class="hidden center"><button id="again" class="primary">VOLVER A INTENTAR</button></div><div class="hint">Protegé la conexión con la tablet. Sobreviví 13 oleadas.</div></main>
<script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),W=document.querySelector('#wave'),O=document.querySelector('#load'),M=document.querySelector('#msg'),hud=document.querySelector('#hud'),intro=document.querySelector('#intro'),controls=document.querySelector('#controls'),end=document.querySelector('#end'),again=document.querySelector('#again');let run=false,raf,last,wave=1,load=0,x=360,shots=[],spawn=0,time=0,shield=0,audio=null;
function aon(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume()}function tone(f,d=.08,v=.03){if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.value=v;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}
function bg(){g.fillStyle='#0c1018';g.fillRect(0,0,720,470);g.strokeStyle='#182231';for(let y=30;y<470;y+=30){g.beginPath();g.moveTo(0,y);g.lineTo(720,y);g.stroke()}}
function text(t,x,y,s=15,b=false){g.fillStyle='#e8edf4';g.textAlign='center';g.font=(b?'bold ':'')+s+'px monospace';g.fillText(t,x,y)}
function dragon(){g.save();g.translate(360,92);g.fillStyle='#596878';g.beginPath();g.moveTo(-80,15);g.lineTo(-145,-30);g.lineTo(-105,45);g.lineTo(-55,38);g.lineTo(0,60);g.lineTo(58,35);g.lineTo(112,42);g.lineTo(150,-25);g.lineTo(72,10);g.lineTo(42,-28);g.lineTo(8,-15);g.lineTo(-20,-42);g.lineTo(-48,-12);g.closePath();g.fill();g.strokeStyle='#a8bacb';g.lineWidth=2;g.stroke();g.fillStyle='#d6c44e';g.fillRect(20,-23,8,5);g.restore()}
function player(){g.save();g.translate(x,390);g.fillStyle='#b6bec8';g.beginPath();g.arc(0,-42,18,0,Math.PI*2);g.fill();g.fillStyle='#273344';g.fillRect(-25,-22,50,55);g.fillStyle=shield>0?'#e7d85f':'#6f8299';g.fillRect(-43,-48,86,48);g.strokeStyle='#dbe7f5';g.strokeRect(-43,-48,86,48);if(shield>0){g.strokeStyle='#e7d85f';g.lineWidth=4;g.beginPath();g.arc(0,-25,62,Math.PI,Math.PI*2);g.stroke()}g.restore()}
function draw(){bg();dragon();text('DRAGÓN // SEÑAL HOSTIL',360,25,13,true);g.strokeStyle='#3d4c60';g.setLineDash([7,8]);g.beginPath();g.moveTo(360,150);g.lineTo(x,330);g.stroke();g.setLineDash([]);for(const s of shots){g.fillStyle=s.kind?'#d6c44e':'#9fb1c6';g.font='bold 22px monospace';g.textAlign='center';g.fillText(s.kind?'#':'@',s.x,s.y)}player();text('TABLET // DEFENSA',x,455,12,true)}
function introDraw(){bg();dragon();text('CONEXIÓN DETECTADA',360,220,28,true);text('EL DRAGÓN HA LOCALIZADO SU DISPOSITIVO.',360,270,14);text('¿DESEA MANTENER LA CONEXIÓN?',360,330,15,true)}
function start(){aon();wave=1;load=0;x=360;shots=[];spawn=0;time=0;shield=0;W.textContent=1;O.textContent=0;run=true;intro.classList.add('hidden');end.classList.add('hidden');controls.classList.remove('hidden');hud.classList.remove('hidden');M.textContent='Bloqueá el torrente digital con la tablet.';last=performance.now();raf=requestAnimationFrame(loop)}
function lose(){run=false;cancelAnimationFrame(raf);tone(120,.4,.05);controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');again.textContent='VOLVER A INTENTAR';M.textContent='La conexión fue sobrecargada.';bg();text('¡ROSTIZADA!',360,180,42,true);text('SOBRECARGA DIGITAL',360,240,18,true);text('BV // ARCHIVO DRAGÓN',360,330,13)}
function win(){run=false;cancelAnimationFrame(raf);tone(880,.25,.04);controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');again.textContent='JUGAR DE NUEVO';M.textContent='Archivo Dragón desbloqueado.';bg();text('13 OLEADAS SUPERADAS',360,145,29,true);text('ARCHIVO DRAGÓN DESBLOQUEADO',360,205,17,true);text('LA CONEXIÓN SIGUE ABIERTA.',360,285,16);text('ROSTIZAME // BUENA VISTA',360,390,14,true)}
function loop(now){if(!run)return;const dt=Math.min((now-last)/1000,.04)||0;last=now;time+=dt;shield=Math.max(0,shield-dt);const newWave=Math.min(13,1+Math.floor(time/5));if(newWave!==wave){wave=newWave;W.textContent=wave;tone(520,.08,.025);M.textContent='OLEADA '+wave+' // La señal aumenta.'}if(time>=65){win();return}spawn-=dt;if(spawn<=0){spawn=Math.max(.28,1.05-wave*.055);shots.push({x:90+Math.random()*540,y:145,v:90+wave*9,kind:Math.random()>.5})}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.y+=s.v*dt;if(s.y>325&&s.y<415&&Math.abs(s.x-x)<65){if(shield>0){shots.splice(i,1);tone(720,.04,.018);continue}}if(s.y>420){shots.splice(i,1);load=Math.min(100,load+7);O.textContent=Math.round(load);tone(170,.06,.018);if(load>=100){lose();return}}}draw();raf=requestAnimationFrame(loop)}
function move(d){if(run)x=Math.max(70,Math.min(650,x+d))}document.querySelector('#accept').onclick=start;again.onclick=start;document.querySelector('#left').onclick=()=>move(-75);document.querySelector('#right').onclick=()=>move(75);document.querySelector('#shield').onclick=()=>{if(run){aon();shield=.65;tone(420,.08,.025)}};introDraw()})();</script></body></html>
