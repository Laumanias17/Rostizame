<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>ROSTIZAME — Archivo Dragón</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#e8edf4;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.k{font-weight:900;letter-spacing:.12em}.sub,.hint{font-size:12px;color:#9aa4b3}.screen{margin-top:12px;border:1px solid #3d4655;border-radius:14px;overflow:hidden;background:#0b0e15;box-shadow:0 0 28px #000}canvas{display:block;width:100%;height:auto;touch-action:none}.msg{text-align:center;min-height:50px;padding:13px 4px}.center{display:flex;justify-content:center;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:auto}button{min-height:56px;border:1px solid #586579;border-radius:12px;background:#141b27;color:#eef4ff;padding:9px;font:700 14px inherit}button.primary{background:#d6c44e;color:#12130d;border-color:#d6c44e}.hidden{display:none!important}.hint{text-align:center;margin-top:12px;line-height:1.4}</style></head><body><main class="wrap"><div class="top"><div><div class="k">BV // ARCHIVO DRAGÓN</div><div class="sub">PROTOCOLO 13 · CONEXIÓN ACTIVA</div></div><div id="hud" class="hidden">OLEADA <b id="wave">1</b>/13 · ⚡ <b id="load">0</b>%</div></div><div class="screen"><canvas id="game" width="720" height="470"></canvas></div><div id="msg" class="msg">Se ha detectado una conexión no autorizada.</div><div id="intro" class="center"><button id="accept" class="primary">MANTENER LA CONEXIÓN</button></div><div id="controls" class="hidden"><div class="actions"><button id="left">◀ MOVER TABLET</button><button id="right">MOVER TABLET ▶</button></div><div class="center"><button id="shield" class="primary">▣ BLOQUEAR</button></div></div><div id="end" class="hidden center"><button id="again" class="primary">VOLVER A INTENTAR</button></div><div class="hint">Protegé la conexión con la tablet. Sobreviví 13 oleadas.</div></main><script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),W=document.querySelector('#wave'),O=document.querySelector('#load'),M=document.querySelector('#msg'),hud=document.querySelector('#hud'),intro=document.querySelector('#intro'),controls=document.querySelector('#controls'),end=document.querySelector('#end'),again=document.querySelector('#again');let run=false,raf,last,wave=1,load=0,x=360,shots=[],spawn=0,time=0,shield=0,audio=null,flash=0;
function aon(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume()}function tone(f,d=.08,v=.03){if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.value=v;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}
function bg(){let q=g.createLinearGradient(0,0,720,470);q.addColorStop(0,wave===13&&run?'#26110d':'#101925');q.addColorStop(.55,'#08121b');q.addColorStop(1,'#41200f');g.fillStyle=q;g.fillRect(0,0,720,470);g.fillStyle='#10151b';g.beginPath();g.moveTo(0,330);g.lineTo(80,265);g.lineTo(120,320);g.lineTo(190,235);g.lineTo(235,330);g.lineTo(300,280);g.lineTo(350,340);g.lineTo(430,245);g.lineTo(480,335);g.lineTo(550,275);g.lineTo(610,330);g.lineTo(720,245);g.lineTo(720,470);g.lineTo(0,470);g.fill();for(let i=0;i<28;i++){let xx=(i*97+time*22)%720,yy=(i*61)%350;g.fillStyle=i%3?'#24425a':'#b87432';g.fillRect(xx,yy,2,2)}}
function text(t,x,y,s=15,b=false,col='#e8edf4'){g.fillStyle=col;g.textAlign='center';g.font=(b?'bold ':'')+s+'px monospace';g.fillText(t,x,y)}
function dragon(){g.save();g.translate(205+Math.sin(time*1.4)*10,130);g.rotate(-.05);g.fillStyle='#263743';g.strokeStyle='#79a8c4';g.lineWidth=2;g.beginPath();g.moveTo(-85,18);g.lineTo(-185,-75);g.lineTo(-145,48);g.lineTo(-78,70);g.lineTo(-18,45);g.lineTo(35,70);g.lineTo(82,32);g.lineTo(122,-20);g.lineTo(105,-50);g.lineTo(66,-58);g.lineTo(34,-38);g.lineTo(10,-63);g.lineTo(-18,-40);g.lineTo(-48,-10);g.closePath();g.fill();g.stroke();g.fillStyle='#18232c';for(let i=-130;i<75;i+=34){g.fillRect(i,5+(i%3)*4,27,18);g.strokeRect(i,5+(i%3)*4,27,18)}g.strokeStyle='#43bce8';g.lineWidth=1;for(let i=-120;i<75;i+=35){g.beginPath();g.moveTo(i,10);g.lineTo(i+16,20);g.lineTo(i+26,8);g.stroke()}g.fillStyle='#58d8ff';g.shadowColor='#58d8ff';g.shadowBlur=15;g.beginPath();g.arc(70,-39,5,0,7);g.fill();g.shadowBlur=0;g.fillStyle='#0b1117';g.beginPath();g.moveTo(80,-24);g.lineTo(132,-8);g.lineTo(88,7);g.closePath();g.fill();g.strokeStyle='#91cfe7';g.stroke();g.restore()}function mouth(){return{x:337+Math.sin(time*1.4)*10,y:122}}
function wifi(){g.save();g.translate(x,303);g.strokeStyle=shield>0?'#f1dc55':'#a8bacb';g.lineWidth=3;for(let r=12;r<=30;r+=9){g.beginPath();g.arc(0,0,r,Math.PI*1.15,Math.PI*1.85);g.stroke()}g.fillStyle='#d6c44e';g.beginPath();g.arc(0,1,3,0,7);g.fill();g.restore()}
function player(){g.save();g.translate(x,397);g.fillStyle='#c2c8ce';g.beginPath();g.arc(0,-45,18,0,Math.PI*2);g.fill();g.fillStyle='#151b24';g.beginPath();g.arc(-5,-47,19,2.8,5.7);g.lineTo(12,-58);g.closePath();g.fill();g.fillStyle='#303b49';g.beginPath();g.moveTo(-24,-25);g.lineTo(25,-25);g.lineTo(18,42);g.lineTo(-18,42);g.closePath();g.fill();g.fillStyle=shield>0?'#f0dc55':'#71869b';g.fillRect(-46,-48,92,50);g.strokeStyle='#dbe7f5';g.lineWidth=2;g.strokeRect(-46,-48,92,50);g.fillStyle='#0d121a';g.fillRect(-38,-41,76,35);g.strokeStyle='#7e94a9';g.beginPath();g.moveTo(-28,-34);g.lineTo(24,-13);g.moveTo(-18,-12);g.lineTo(30,-30);g.stroke();if(shield>0){g.strokeStyle='#f1dc55';g.lineWidth=4;g.beginPath();g.arc(0,-27,67,Math.PI,Math.PI*2);g.stroke()}g.restore();wifi()}
const glyph=['@','#','01','QR','⌁','!','+','//','13'];
function draw(){bg();dragon();text(wave===13?'DRAGÓN // NIVEL CRÍTICO':'DRAGÓN // SEÑAL HOSTIL',205,24,13,true,wave===13?'#f0c85c':'#dbe7f5');let m=mouth();g.strokeStyle='#43bce8';g.lineWidth=2;g.globalAlpha=.32;for(let j=-2;j<=2;j++){g.beginPath();g.moveTo(m.x,m.y+j*4);g.quadraticCurveTo(430+j*10,210,x+j*15,330);g.stroke()}g.globalAlpha=1;for(const s of shots){g.save();g.translate(s.x,s.y);g.rotate(s.r);text(s.t,0,0,s.sz,true,s.hot?'#f0a34a':'#55cfff');g.restore()}player();text('TABLET // DEFENSA',x,458,12,true);if(flash>0){g.fillStyle='rgba(74,195,239,'+Math.min(.16,flash)+')';g.fillRect(0,0,720,470)}}
function introDraw(){bg();dragon();text('ROSTIZAME',500,92,38,true,'#d6a84e');text('CONEXIÓN DETECTADA',500,145,20,true);text('EL DRAGÓN HA LOCALIZADO',500,190,13);text('SU DISPOSITIVO.',500,214,13);text('¿DESEA MANTENER LA CONEXIÓN?',500,270,13,true);text('BV',42,38,22,true);text('13',670,430,32,true,'#d6a84e')}
function start(){aon();wave=1;load=0;x=360;shots=[];spawn=0;time=0;shield=0;flash=0;W.textContent=1;O.textContent=0;run=true;intro.classList.add('hidden');end.classList.add('hidden');controls.classList.remove('hidden');hud.classList.remove('hidden');M.textContent='Bloqueá el torrente digital con la tablet.';last=performance.now();raf=requestAnimationFrame(loop)}
function lose(){run=false;cancelAnimationFrame(raf);tone(120,.4,.05);controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');again.textContent='VOLVER A INTENTAR';M.textContent='La conexión fue sobrecargada.';bg();text('¡ROSTIZADA!',360,180,42,true,'#d6c44e');text('SOBRECARGA DIGITAL',360,240,18,true);text('BV // ARCHIVO DRAGÓN',360,330,13)}
function win(){run=false;cancelAnimationFrame(raf);tone(880,.25,.04);controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');again.textContent='JUGAR DE NUEVO';M.textContent='Archivo Dragón desbloqueado.';bg();text('13 OLEADAS SUPERADAS',360,145,29,true,'#d6c44e');text('ARCHIVO DRAGÓN DESBLOQUEADO',360,205,17,true);text('REFERENCIA CRUZADA // ARCHIVO 13',360,258,13,true,'#9fb4c8');text('LA CONEXIÓN SIGUE ABIERTA.',360,310,16);text('ROSTIZAME // BUENA VISTA',360,390,14,true)}
function waveMsg(n){if(n===4)return'SEÑAL BV INTERCEPTADA';if(n===7)return'CONEXIÓN INESTABLE // NO DESCONECTAR';if(n===10)return'REFERENCIA DETECTADA // 13-B';if(n===13)return'OLEADA 13 // NIVEL CRÍTICO';return'OLEADA '+n+' // La señal aumenta.'}
function loop(now){if(!run)return;const dt=Math.min((now-last)/1000,.04)||0;last=now;time+=dt;shield=Math.max(0,shield-dt);flash=Math.max(0,flash-dt);const nw=Math.min(13,1+Math.floor(time/5));if(nw!==wave){wave=nw;W.textContent=wave;tone(wave===13?180:520,.1,.03);M.textContent=waveMsg(wave);flash=.18}if(time>=65){win();return}spawn-=dt;if(spawn<=0){spawn=Math.max(.28,1.05-wave*.055);(()=>{let m=mouth(),tx=90+Math.random()*540,dy=420-m.y,dx=tx-m.x,v=90+wave*9;shots.push({x:m.x,y:m.y,v,vx:dx/dy*v,t:glyph[Math.floor(Math.random()*glyph.length)],sz:15+Math.random()*9,r:(Math.random()-.5)*.35,hot:Math.random()>.58})})()}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.y+=s.v*dt;s.x+=(s.vx||0)*dt;s.r+=dt*.5;if(s.y>325&&s.y<415&&Math.abs(s.x-x)<65&&shield>0){shots.splice(i,1);tone(720,.04,.018);continue}if(s.y>420){shots.splice(i,1);load=Math.min(100,load+7);O.textContent=Math.round(load);tone(170,.06,.018);if(load>=100){lose();return}}}draw();raf=requestAnimationFrame(loop)}
function move(d){if(run)x=Math.max(70,Math.min(650,x+d))}document.querySelector('#accept').onclick=start;again.onclick=start;document.querySelector('#left').onclick=()=>move(-75);document.querySelector('#right').onclick=()=>move(75);document.querySelector('#shield').onclick=()=>{if(run){aon();shield=.65;tone(420,.08,.025)}};introDraw()})();</script></body></html>
