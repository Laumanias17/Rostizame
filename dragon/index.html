_47_36%20p.m..png?v=24';const bad=['FAKE','RUMOR','MIEDO','CLICKBAIT','SIN FUENTE','MANIPULADO','VIRALES','COLAPSISTA','PATRÓN','VIGILANCIA','SATURACIÓN','DOXEAR','PSICOSIS','HOMOFOBIA','SERVIDUMBRE','HATER','GHOSTING','BULLYING','FLAMING','CATFISHING','DEADNAMING'],good=['VERDAD','FUENTE','EVIDENCIA','CONTEXTO','VERIFICADO','DOCUMENTO','ABRAXAS','JESÚS TE AMA','STALKER','LA PATRIA ES EL OTRO','GÉNERO','KUKA','DESEO'],myst=['BOOT','GANESHA','REBAÑO','POESÍA','MILEI','STORE','ARE PROTEGIDA','CONECTAR','DUAT','BUENAVISTA','XHOUSA','MUBARAK','PACK','UNBOXING','5G','GILGAMESH','3%','ALTAR','BACKROOM','APEGO','BIBLIA','REBIS','PLUTÓN','LITERAL','FILTRO','MEDUSA','FILO','SIN TEXTO','FLOW','CATABASIS','BAPHOMET','CARDIO','ROBÓTICA','SIN INTERÉS','JUGAR AL MUERTO','PARÁLISIS DEL SUEÑO','TABLA ESMERALDA','EXTINGUIDOR','TAROT','APLICACIÓN','LOGIA','HUMANISMO','DISOCIADO','ICEBERG','SÍMBOLO','VELO','DIOS HA MUERTO','ARQUETIPOS','HASHTAG','CONTENER','WOKE','DERECHA','FERNET','ACADÉMICO','RELIGIÓN','ETIQUETA','SUPERÁVIT','PARADA SOLICITADA','CAMPUS VIRTUAL','PET FRIENDLY','CONTEXTO','VINCULAR','ABIERTO','PULSE Y ESPERE','NO ENTRE','ICONOS','ULTRA','DEPILACIÓN'];let run=false,score=0,lives=3,objs=[],spawn=0,last=0,raf,audio=null,flash=0,roast=false,battery=100,glitch=0,amb=null,recent=[],deck=[],deckPos=0;function ambience(){if(!audio||amb)return;let o=audio.createOscillator(),a=audio.createGain(),l=audio.createBiquadFilter();o.type='sawtooth';o.frequency.value=43;l.type='lowpass';l.frequency.value=115;a.gain.value=.006;o.connect(l);l.connect(a);a.connect(audio.destination);o.start();amb={o,a}}function sting(){if(!audio)return;[110,165,220,330].forEach((f,i)=>setTimeout(()=>snd(f,.35),i*90))}function snd(f,d=.08){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.value=.035;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}function bg(){if(ART.complete&&ART.naturalWidth)g.drawImage(ART,0,0,720,470);else{g.fillStyle='#07111b';g.fillRect(0,0,720,470)}g.fillStyle='rgba(1,8,15,.24)';g.fillRect(0,0,720,470);let t=performance.now()/1000;g.fillStyle='rgba(80,220,255,'+(0.025+Math.sin(t*2)*.012)+')';g.fillRect(0,0,720,470)}function hud(){H.textContent=score+' / 13 · '+('♥'.repeat(lives)+'♡'.repeat(3-lives))+(battery<100?' · 🔋'+battery+'%':'')}function refillDeck(){deck=[];for(const label of bad)deck.push({label,kind:'bad'});for(const label of good)deck.push({label,kind:'good'});for(const label of myst)deck.push({label,kind:'myst'});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1)),t=deck[i];deck[i]=deck[j];deck[j]=t}deckPos=0}function nextWord(){if(deckPos>=deck.length)refillDeck();return deck[deckPos++]}function make(){let rare=Math.random();if(rare<.012){let gifts=['ALEPH','DAIMON','ANÁMNESIS','OUROBOROS','SATOR'],label=gifts[Math.floor(Math.random()*gifts.length)];objs.push({label,evil:false,kind:'gift',x:310+Math.random()*55,y:180+Math.random()*35,v:38+score,r:label.length>8?65:50});return}if(rare<.047){let specials=['FILEMÓN','BACKROOM','3%','ROSTIZA','TE ESTÁ MIRANDO'],label=specials[Math.floor(Math.random()*specials.length)];objs.push({label,evil:false,kind:'special',x:310+Math.random()*55,y:180+Math.random()*35,v:42+score*2,r:label.length>10?70:50});return}let w=nextWord(),label=w.label,kind=w.kind;objs.push({label,evil:kind==='bad',kind,x:310+Math.random()*55,y:180+Math.random()*35,v:45+score*2,r:label.length>16?100:label.length>8?65:43})}function text(t,x,y,s=16){g.textAlign='center';g.textBaseline='middle';g.font='900 '+s+'px monospace';g.fillStyle='#fff';g.fillText(t,x,y)}function draw(){bg();for(const o of objs){g.save();const col=o.kind==='gift'?'#ffd84d':o.kind==='special'?'#ffe56d':o.kind==='myst'?'#d6b8ff':o.evil?'#ff9b65':'#65e8ff';g.shadowColor=col;g.shadowBlur=o.kind==='gift'?30:18;g.fillStyle='rgba(3,15,26,.86)';g.strokeStyle=col;g.lineWidth=o.kind==='gift'?5:3;g.beginPath();g.roundRect(o.x-o.r,o.y-23,o.r*2,46,10);g.fill();g.stroke();text(o.label,o.x,o.y,o.label.length>16?10:o.label.length>9?12:16);g.restore()}if(flash){g.fillStyle=flash>0?'rgba(80,230,255,.22)':'rgba(255,55,30,.22)';g.fillRect(0,0,720,470)}if(glitch>0){g.fillStyle='rgba(220,190,80,.12)';g.fillRect(0,0,720,470);for(let i=0;i<5;i++){g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,Math.random()*470,720,2)}}}function hit(o,wrong){objs=objs.filter(x=>x!==o);if(wrong){lives--;flash=-1;snd(150,.18);M.textContent='ELIMINASTE INFORMACIÓN QUE PODÍA PASAR';if(navigator.vibrate)navigator.vibrate([50,30,50])}else{score++;flash=1;snd(850,.08);M.textContent='INTERCEPTADO ✓';if(navigator.vibrate)navigator.vibrate(25)}hud();if(score>=13){roast=true;M.textContent='PREMIO DESBLOQUEADO // ROSTIZA';snd(1040,.18);setTimeout(win,650)}else if(lives<=0)lose()}function tap(e){if(!run)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*720/r.width,y=(e.clientY-r.top)*470/r.height;for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(Math.abs(x-o.x)<o.r+12&&Math.abs(y-o.y)<36){if(o.kind==='gift'){objs=objs.filter(x=>x!==o);flash=1;let giftMsg='';if(o.label==='ALEPH'){lives=Math.min(3,lives+1);giftMsg='+1 VIDA'}else if(o.label==='DAIMON'){for(const x of objs)x.v*=.45;giftMsg='TIEMPO RALENTIZADO'}else if(o.label==='ANÁMNESIS'){for(const x of objs)x.v=0;setTimeout(()=>{for(const x of objs)x.v=45+score*2},2500);giftMsg='SEÑALES CONGELADAS'}else if(o.label==='OUROBOROS'){lives=3;giftMsg='PROTECCIÓN RESTAURADA'}else{score=Math.min(13,score+2);giftMsg='+2 FILTRO'}hud();snd(1250,.3);M.textContent='DON SUPREMO ADQUIRIDO // '+o.label+' // '+giftMsg;if(navigator.vibrate)navigator.vibrate([30,40,80]);if(score>=13)return win()}else if(o.kind==='special'){objs=objs.filter(x=>x!==o);flash=1;snd(980,.14);if(o.label==='FILEMÓN')M.textContent='ARCHIVO ANTERIOR DETECTADO // FILEMÓN';else if(o.label==='BACKROOM'){glitch=2;M.textContent='UBICACIÓN NO RECONOCIDA // BACKROOM'}else if(o.label==='3%'){battery=3;hud();M.textContent='ADVERTENCIA // BATERÍA 3%'}else if(o.label==='ROSTIZA'){score=Math.min(13,score+2);hud();M.textContent='BONUS SECRETO // ROSTIZA +2';if(score>=13)return win()}else M.textContent='TE ESTÁ MIRANDO';if(navigator.vibrate)navigator.vibrate([20,20,40])}else if(o.kind==='myst'){objs=objs.filter(x=>x!==o);flash=1;snd(660,.12);M.textContent='INTERFERENCIA // '+o.label+' // SIN CLASIFICAR';if(navigator.vibrate)navigator.vibrate(20)}else hit(o,!o.evil);break}}}function loop(n){if(!run)return;let dt=Math.min(.04,(n-last)/1000||0);last=n;spawn-=dt;if(spawn<=0){make();spawn=Math.max(.78,1.42-score*.022)}for(const o of [...objs]){let dx=565-o.x,dy=360-o.y,d=Math.hypot(dx,dy);o.x+=dx/d*o.v*dt;o.y+=dy/d*o.v*dt;if(d<35){objs=objs.filter(x=>x!==o);if(o.kind==='special'){M.textContent='SEÑAL PERDIDA // '+o.label;snd(700,.08)}else if(o.kind==='myst'){M.textContent='ARCHIVO RECIBIDO // '+o.label+' // SIN CLASIFICAR';snd(620,.08)}else if(o.evil){lives--;flash=-1;snd(120,.2);M.textContent='ALGO QUE DEBÍAS FILTRAR LLEGÓ A LA TABLET';hud();if(lives<=0)return lose()}else{M.textContent='INFORMACIÓN ÚTIL RECIBIDA ✓';snd(520,.06)}}}flash*=.88;glitch=Math.max(0,glitch-dt);draw();raf=requestAnimationFrame(loop)}function start(){VOICE.pause();VOICE.currentTime=0;VOICE.muted=false;VOICE.volume=1;VOICE.load();if(!audio){let C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio&&audio.state==='suspended')audio.resume();ambience();run=true;score=0;lives=3;objs=[];deck=[];deckPos=0;refillDeck();spawn=.5;roast=false;battery=100;glitch=0;B.classList.add('hide');A.classList.add('hide');M.textContent='CUIDÁ LO QUE DEJÁS PASAR.';hud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function lose(){run=false;A.classList.remove('hide');M.textContent='CONEXIÓN PERDIDA';bg();text('¡ROSTIZADA!',360,205,42);text('EL FILTRO FUE SOBRECARGADO',360,255,16)}function win(){if(!run)return;run=false;A.classList.add('hide');if(amb){try{amb.a.gain.setTargetAtTime(.0001,audio.currentTime,.08)}catch(e){}}bg();text('13 / 13',360,195,38);text('SEÑAL COMPLETA',360,245,17);text('TRANSMISIÓN DE VOZ...',360,292,14);M.textContent='TRANSMISIÓN INTERRUMPIDA...';let finished=false;function finale(){if(finished)return;finished=true;sting();bg();text('ROSTIZA',360,175,52);text('ARCHIVO 13 DESBLOQUEADO',360,235,19);text('NO TODO LO QUE LLEGA MERECE ENTRAR.',360,285,15);setTimeout(()=>{bg();text('...',360,210,34);M.textContent='NUEVA SEÑAL RECIBIDA';snd(880,.25)},1000);setTimeout(()=>{bg();text('AHORA EL DRAGÓN',360,175,24);text('SABE QUE ESTÁS AHÍ.',360,215,24);text('BV // ARCHIVO 13',360,290,16);text('ROSTIZAME // BUENA VISTA',360,345,14);M.textContent='CONEXIÓN CERRADA';A.classList.remove('hide');if(navigator.vibrate)navigator.vibrate([60,80,120])},1900)}VOICE.pause();VOICE.currentTime=0;VOICE.onended=finale;VOICE.onerror=()=>setTimeout(finale,600);M.textContent='TRANSMISIÓN DE VOZ DISPONIBLE';A.textContent='ESCUCHAR TRANSMISIÓN';A.classList.remove('hide');A.onclick=()=>{A.classList.add('hide');VOICE.currentTime=0;VOICE.muted=false;VOICE.volume=1;VOICE.play().catch(finale)}}c.addEventListener('pointerdown',tap);B.addEventListener('click',start);A.addEventListener('click',start);ART.onload=draw;draw()})();</script></body></html>
