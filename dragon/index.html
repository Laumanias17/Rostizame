<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101a"><title>ROSTIZAME — Archivo Dragón</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#eef4ff;font-family:ui-monospace,monospace}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.k{font-weight:900;letter-spacing:.1em}.sub,.hint{font-size:12px;color:#a8b3c2}.screen{margin-top:10px;border:1px solid #3d4655;border-radius:14px;overflow:hidden;background:#09111c}canvas{display:block;width:100%;height:auto}.msg{text-align:center;min-height:55px;padding:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:540px;margin:auto}button{min-height:62px;border:1px solid #64758a;border-radius:12px;background:#152131;color:#fff;font:800 15px inherit;padding:8px}button.block{background:#173c50;border-color:#69dfff}.center{display:flex;justify-content:center;margin-top:10px}.primary{background:#d6c44e!important;color:#12130d!important}.hidden{display:none!important}.hint{text-align:center;margin-top:12px;line-height:1.4}</style></head><body><main class="wrap"><div class="top"><div><div class="k">BV // ARCHIVO DRAGÓN</div><div class="sub">FILTRO DE INFORMACIÓN // PROTOCOLO 13</div></div><div id="hud" class="hidden">DECISIONES <b id="score">0</b>/13 · ERRORES <b id="err">0</b>/3</div></div><div class="screen"><canvas id="game" width="720" height="470"></canvas></div><div id="msg" class="msg">El dragón arroja información. Vos decidís qué hacer con ella.</div><div id="intro" class="center"><button id="start" class="primary">ABRIR EL FILTRO</button></div><div id="controls" class="actions hidden"><button id="pass">✓ DEJAR PASAR</button><button id="block" class="block">▣ BLOQUEAR</button></div><div id="end" class="center hidden"><button id="again" class="primary">JUGAR DE NUEVO</button></div><div class="hint">Leé lo que arroja el dragón. No todo debe bloquearse.</div></main><script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),S=document.querySelector('#score'),E=document.querySelector('#err'),M=document.querySelector('#msg'),hud=document.querySelector('#hud'),intro=document.querySelector('#intro'),controls=document.querySelector('#controls'),end=document.querySelector('#end');const ART=new Image();ART.src='./ChatGPT%20Image%2017%20sept%202026%2C%2010_47_36%20p.m..png?v=15';let audio=null,run=false,good=0,errors=0,item=null,timer=0,raf,last=0,flash=0;const items=[['FAKE',1],['CADENA SIN FUENTE',1],['RUMOR',1],['CLICKBAIT',1],['IMAGEN MANIPULADA',1],['DATO SIN VERIFICAR',1],['FUENTE',0],['EVIDENCIA',0],['CONTEXTO',0],['VERIFICADO',0],['DOCUMENTO',0],['CONTRASTE',0],['PREGUNTA',0],['REALIDAD',0]];function aon(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume()}function tone(f,d=.1,v=.035){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.value=v;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}function bg(){if(ART.complete&&ART.naturalWidth)g.drawImage(ART,0,0,720,470);else{g.fillStyle='#07101a';g.fillRect(0,0,720,470)}g.fillStyle='rgba(2,8,16,.18)';g.fillRect(0,0,720,470)}function txt(t,x,y,s=18,col='#fff'){g.textAlign='center';g.fillStyle=col;g.font='bold '+s+'px monospace';g.fillText(t,x,y)}function next(){item=items[Math.floor(Math.random()*items.length)];timer=4.2;M.textContent='¿LO DEJÁS PASAR O LO BLOQUEÁS?'}function draw(){bg();if(item){let p=1-timer/4.2,x=310+Math.min(1,p)*205,y=190+Math.min(1,p)*145;g.save();g.shadowColor=item[1]?'#ff8b57':'#63ddff';g.shadowBlur=22;g.fillStyle='rgba(4,14,25,.82)';g.strokeStyle=item[1]?'#ff9b62':'#78e7ff';g.lineWidth=3;g.beginPath();g.roundRect(x-105,y-27,210,54,12);g.fill();g.stroke();txt(item[0],x,y+7,item[0].length>15?14:19);g.restore()}if(flash){g.fillStyle=flash>0?'rgba(90,225,255,.16)':'rgba(255,70,40,.18)';g.fillRect(0,0,720,470)}}function decide(block){if(!run||!item)return;aon();let correct=(block&&item[1])||(!block&&!item[1]);if(correct){good++;S.textContent=good;tone(820,.1);M.textContent=block?'BLOQUEADO ✓':'PASA ✓';flash=.16;if(navigator.vibrate)navigator.vibrate(30)}else{errors++;E.textContent=errors;tone(150,.22,.05);M.textContent=block?'BLOQUEASTE ALGO ÚTIL':'DEJASTE PASAR INFORMACIÓN DUDOSA';flash=-.18;if(navigator.vibrate)navigator.vibrate([50,30,50])}item=null;if(good>=13)return win();if(errors>=3)return lose();setTimeout(()=>{if(run)next()},420)}function loop(n){if(!run)return;let dt=Math.min(.05,(n-last)/1000||0);last=n;if(item){timer-=dt;if(timer<=0){errors++;E.textContent=errors;item=null;tone(130,.2,.05);M.textContent='NO DECIDISTE A TIEMPO';if(errors>=3)return lose();setTimeout(()=>{if(run)next()},400)}}flash*=.88;draw();raf=requestAnimationFrame(loop)}function start(){aon();run=true;good=0;errors=0;S.textContent=0;E.textContent=0;intro.classList.add('hidden');end.classList.add('hidden');controls.classList.remove('hidden');hud.classList.remove('hidden');next();last=performance.now();raf=requestAnimationFrame(loop)}function lose(){run=false;controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');M.textContent='El filtro fue sobrecargado.';bg();txt('¡ROSTIZADA!',360,205,42,'#ffd35f');txt('3 ERRORES // CONEXIÓN PERDIDA',360,255,16)}function win(){run=false;controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');M.textContent='Archivo Dragón desbloqueado.';bg();txt('13 / 13',360,170,42,'#ffd35f');txt('ARCHIVO DRAGÓN DESBLOQUEADO',360,225,19);txt('NO TODO LO QUE LLEGA DEBE PASAR.',360,280,15,'#7fe8ff');txt('ROSTIZAME // BUENA VISTA',360,350,14)}document.querySelector('#start').onclick=start;document.querySelector('#again').onclick=start;document.querySelector('#block').onclick=()=>decide(true);document.querySelector('#pass').onclick=()=>decide(false);ART.onload=()=>draw();draw()})();</script></body></html>
