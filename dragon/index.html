<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><title>ROSTIZAME — Archivo Dragón</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#e8edf4;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.wrap{max-width:760px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.k{font-weight:900;letter-spacing:.12em}.sub,.hint{font-size:12px;color:#9aa4b3}.screen{margin-top:12px;border:1px solid #3d4655;border-radius:14px;overflow:hidden;background:#0b0e15;box-shadow:0 0 28px #000}canvas{display:block;width:100%;height:auto;touch-action:none}.msg{text-align:center;min-height:50px;padding:13px 4px}.center{display:flex;justify-content:center;margin-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:auto}button{min-height:56px;border:1px solid #586579;border-radius:12px;background:#141b27;color:#eef4ff;padding:9px;font:700 14px inherit}button.primary{background:#d6c44e;color:#12130d;border-color:#d6c44e}.hidden{display:none!important}.hint{text-align:center;margin-top:12px;line-height:1.4}</style></head><body><main class="wrap"><div class="top"><div><div class="k">BV // ARCHIVO DRAGÓN</div><div class="sub">PROTOCOLO 13 · CONEXIÓN ACTIVA</div></div><div id="hud" class="hidden">OLEADA <b id="wave">1</b>/13 · ⚡ <b id="load">0</b>%</div></div><div class="screen"><canvas id="game" width="720" height="470"></canvas></div><div id="msg" class="msg">Se ha detectado una conexión no autorizada.</div><div id="intro" class="center"><button id="accept" class="primary">MANTENER LA CONEXIÓN</button></div><div id="controls" class="hidden"><div class="actions"><button id="left">◀ MOVER TABLET</button><button id="right">MOVER TABLET ▶</button></div><div class="center"><button id="shield" class="primary">▣ BLOQUEAR</button></div></div><div id="end" class="hidden center"><button id="again" class="primary">VOLVER A INTENTAR</button></div><div class="hint">Protegé la conexión con la tablet. Sobreviví 13 oleadas.</div></main><script>(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),W=document.querySelector('#wave'),O=document.querySelector('#load'),M=document.querySelector('#msg'),hud=document.querySelector('#hud'),intro=document.querySelector('#intro'),controls=document.querySelector('#controls'),end=document.querySelector('#end'),again=document.querySelector('#again');let run=false,raf,last,wave=1,load=0,x=520,shots=[],spawn=0,time=0,shield=0,audio=null,flash=0,score=0,lives=3;
function aon(){if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio&&audio.state==='suspended')audio.resume()}function fire(d=.32){if(!audio)return;let n=Math.max(1,Math.floor(audio.sampleRate*d)),b=audio.createBuffer(1,n,audio.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);let src=audio.createBufferSource(),fil=audio.createBiquadFilter(),gain=audio.createGain();fil.type='lowpass';fil.frequency.setValueAtTime(1500,audio.currentTime);fil.frequency.exponentialRampToValueAtTime(260,audio.currentTime+d);gain.gain.setValueAtTime(.075,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);src.buffer=b;src.connect(fil);fil.connect(gain);gain.connect(audio.destination);src.start()}function roar(){if(!audio)return;let o=audio.createOscillator(),gain=audio.createGain(),fil=audio.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(82,audio.currentTime);o.frequency.exponentialRampToValueAtTime(42,audio.currentTime+.32);fil.type='lowpass';fil.frequency.value=280;gain.gain.setValueAtTime(.035,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.35);o.connect(fil);fil.connect(gain);gain.connect(audio.destination);o.start();o.stop(audio.currentTime+.36)}function tone(f,d=.08,v=.03){if(!audio)return;const o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.value=v;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}
const ART=new Image();ART.src='ChatGPT%20Image%2017%20sept%202026%2C%2010_33_43%20p.m..png';
function bg(){if(ART.complete&&ART.naturalWidth){g.drawImage(ART,0,0,720,470);g.fillStyle='rgba(3,8,15,.10)';g.fillRect(0,0,720,470)}else{g.fillStyle='#07101a';g.fillRect(0,0,720,470)}}
function text(t,x,y,s=15,b=false,col='#e8edf4'){g.fillStyle=col;g.textAlign='center';g.font=(b?'bold ':'')+s+'px monospace';g.fillText(t,x,y)}
function dragon(){if(!(ART.complete&&ART.naturalWidth))return;let pulse=.5+.5*Math.sin(time*5);g.save();g.globalCompositeOperation='screen';g.fillStyle='rgba(75,205,255,'+(.05+.08*pulse)+')';g.shadowColor='#55d8ff';g.shadowBlur=18;g.beginPath();g.arc(292,184,8+5*pulse,0,Math.PI*2);g.fill();g.beginPath();g.arc(257,135,4+2*pulse,0,Math.PI*2);g.fill();g.restore();for(let i=0;i<5;i++){let px=278+((time*35+i*43)%90),py=172+Math.sin(time*3+i)*18;g.fillStyle='rgba(93,220,255,'+(.12+i*.025)+')';g.fillRect(px,py,2+i%2,2+i%2)}}function mouth(){return{x:292,y:184}}
function wifi(){g.save();g.translate(x,303);g.strokeStyle=shield>0?'#f1dc55':'#a8bacb';g.lineWidth=3;for(let r=12;r<=30;r+=9){g.beginPath();g.arc(0,0,r,Math.PI*1.15,Math.PI*1.85);g.stroke()}g.fillStyle='#d6c44e';g.beginPath();g.arc(0,1,3,0,7);g.fill();g.restore()}
function player(){g.save();g.translate(x,397);if(shield>0){g.strokeStyle='#68ddff';g.shadowColor='#68ddff';g.shadowBlur=20;g.lineWidth=5;g.beginPath();g.arc(0,-25,64,Math.PI,Math.PI*2);g.stroke();g.shadowBlur=0;g.fillStyle='rgba(80,215,255,.12)';g.beginPath();g.arc(0,-25,60,Math.PI,Math.PI*2);g.fill()}wifi();g.restore()}
const glyph=['@','#','01','QR','⌁','!','+','//','13'];
function draw(){bg();dragon();text('NIVEL '+wave+' / 13',360,24,15,true,'#e8edf4');text('PUNTAJE '+String(score).padStart(6,'0'),585,24,13,true,'#68ddff');text('VIDAS '+('♥'.repeat(lives)),600,48,14,true,'#ff6b6b');text(wave===13?'DRAGÓN // NIVEL CRÍTICO':'DRAGÓN // SEÑAL HOSTIL',205,24,13,true,wave===13?'#f0c85c':'#dbe7f5');let m=mouth();g.strokeStyle='#43bce8';g.lineWidth=2;g.globalAlpha=.32;for(let j=-2;j<=2;j++){g.beginPath();g.moveTo(m.x,m.y+j*4);g.quadraticCurveTo(430+j*10,210,x+j*15,330);g.stroke()}g.globalAlpha=1;g.save();g.strokeStyle='#8be8ff';g.shadowColor='#59d7ff';g.shadowBlur=16;g.lineWidth=3+2*Math.sin(time*8);g.beginPath();g.arc(m.x,m.y,24+5*Math.sin(time*6),-.5,.5);g.stroke();g.restore();for(const s of shots){g.save();g.translate(s.x,s.y);g.rotate(s.r);text(s.t,0,0,s.sz,true,s.hot?'#f0a34a':'#55cfff');g.restore()}player();text('TABLET // DEFENSA',x,458,12,true);if(flash>0){g.fillStyle='rgba(74,195,239,'+Math.min(.16,flash)+')';g.fillRect(0,0,720,470)}}
function introDraw(){bg();dragon();text('BV // ARCHIVO DRAGÓN',360,32,16,true);text('CONEXIÓN DETECTADA',360,390,22,true,'#68ddff');text('¿DESEA MANTENER LA CONEXIÓN?',360,425,14,true)}
function start(){aon();wave=1;load=0;x=520;score=0;lives=3;shots=[];spawn=0;time=0;shield=0;flash=0;W.textContent=1;O.textContent=0;run=true;intro.classList.add('hidden');end.classList.add('hidden');controls.classList.remove('hidden');hud.classList.remove('hidden');M.textContent='Bloqueá el torrente digital con la tablet.';last=performance.now();raf=requestAnimationFrame(loop)}
function lose(){run=false;cancelAnimationFrame(raf);tone(120,.4,.05);controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');again.textContent='VOLVER A INTENTAR';M.textContent='La conexión fue sobrecargada.';bg();text('¡ROSTIZADA!',360,180,42,true,'#d6c44e');text('SOBRECARGA DIGITAL',360,240,18,true);text('BV // ARCHIVO DRAGÓN',360,330,13)}
function win(){run=false;cancelAnimationFrame(raf);tone(880,.25,.04);controls.classList.add('hidden');hud.classList.add('hidden');end.classList.remove('hidden');again.textContent='JUGAR DE NUEVO';M.textContent='Archivo Dragón desbloqueado.';bg();text('13 OLEADAS SUPERADAS',360,145,29,true,'#d6c44e');text('ARCHIVO DRAGÓN DESBLOQUEADO',360,205,17,true);text('REFERENCIA CRUZADA // ARCHIVO 13',360,258,13,true,'#9fb4c8');text('LA CONEXIÓN SIGUE ABIERTA.',360,310,16);text('ROSTIZAME // BUENA VISTA',360,390,14,true)}
function waveMsg(n){if(n===4)return'SEÑAL BV INTERCEPTADA';if(n===7)return'CONEXIÓN INESTABLE // NO DESCONECTAR';if(n===10)return'REFERENCIA DETECTADA // 13-B';if(n===13)return'OLEADA 13 // NIVEL CRÍTICO';return'OLEADA '+n+' // La señal aumenta.'}
function loop(now){if(!run)return;const dt=Math.min((now-last)/1000,.04)||0;last=now;time+=dt;shield=Math.max(0,shield-dt);flash=Math.max(0,flash-dt);const nw=Math.min(13,1+Math.floor(time/5));if(nw!==wave){wave=nw;W.textContent=wave;tone(wave===13?180:520,.1,.03);roar();setTimeout(()=>fire(wave===13?.55:.24),90);M.textContent=waveMsg(wave);flash=.18}if(time>=65){win();return}spawn-=dt;if(spawn<=0){spawn=Math.max(.28,1.05-wave*.055);if(Math.random()<.28)fire(.16);(()=>{let m=mouth(),tx=90+Math.random()*540,dy=420-m.y,dx=tx-m.x,v=90+wave*9;shots.push({x:m.x,y:m.y,v,vx:dx/dy*v,t:glyph[Math.floor(Math.random()*glyph.length)],sz:15+Math.random()*9,r:(Math.random()-.5)*.35,hot:Math.random()>.58})})()}for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.y+=s.v*dt;s.x+=(s.vx||0)*dt;s.r+=dt*.5;if(s.y>325&&s.y<415&&Math.abs(s.x-x)<65&&shield>0){shots.splice(i,1);score+=100+wave*10;tone(720,.04,.018);flash=.06;continue}if(s.y>420){shots.splice(i,1);load=Math.min(100,load+12);lives=Math.max(0,3-Math.floor(load/34));O.textContent=Math.round(load);tone(170,.06,.018);if(load>=100){lose();return}}}draw();raf=requestAnimationFrame(loop)}
function move(d){if(run)x=Math.max(360,Math.min(650,x+d))}document.querySelector('#accept').onclick=start;again.onclick=start;document.querySelector('#left').onclick=()=>move(-75);document.querySelector('#right').onclick=()=>move(75);document.querySelector('#shield').onclick=()=>{if(run){aon();shield=.65;tone(420,.08,.025)}};introDraw()})();</script></body></html>
