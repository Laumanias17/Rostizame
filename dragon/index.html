<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101a"><title>ROSTIZAME — Archivo Dragón V16</title><style>*{box-sizing:border-box}body{margin:0;background:#05090e;color:#eafcff;font-family:ui-monospace,monospace}.w{max-width:760px;margin:auto;padding:12px}.head{display:flex;justify-content:space-between;gap:8px;font-size:13px}.k{font-weight:900;letter-spacing:.08em}.mut{color:#8ecfe0}.box{margin-top:9px;border:1px solid #3b6975;border-radius:14px;overflow:hidden;background:#07111b;position:relative}canvas{display:block;width:100%;height:auto;touch-action:manipulation}.msg{text-align:center;min-height:50px;padding:10px;font-weight:700}.center{text-align:center}button{min-height:52px;border:1px solid #61dff1;border-radius:12px;background:#0d3542;color:#eaffff;font:900 15px inherit;padding:0 24px}.hint{text-align:center;color:#9fb8c1;font-size:12px;line-height:1.4;margin-top:10px}.hide{display:none}</style></head><body><main class="w"><div class="head"><div><div class="k">BV // ARCHIVO DRAGÓN</div><div class="mut">PENSÁ · TOCÁ · FILTRÁ · SOBREVIVÍ</div></div><div id="hud">0 / 13 · ♥♥♥</div></div><div class="box"><canvas id="c" width="720" height="470"></canvas></div><div id="m" class="msg">El dragón envía información constante.</div><div class="center"><button id="start">COMENZAR</button><button id="again" class="hide">JUGAR DE NUEVO</button></div><div class="hint">Tocá únicamente lo que quieras eliminar antes de que llegue a la tablet. Cuidá lo que dejás pasar.</div></main><script>(()=>{const c=document.querySelector('#c'),g=c.getContext('2d'),M=document.querySelector('#m'),H=document.querySelector('#hud'),B=document.querySelector('#start'),A=document.querySelector('#again');const ART=new Image();ART.src='./ChatGPT%20Image%2017%20sept%202026%2C%2010_47_36%20p.m..png?v=16';const bad=['FAKE','RUMOR','MIEDO','CLICKBAIT','SIN FUENTE','MANIPULADO'],good=['VERDAD','FUENTE','EVIDENCIA','CONTEXTO','VERIFICADO','DOCUMENTO'],myst=['BOOT','GANESHA','REBAÑO','POESÍA','MILEI','STORE','ARE PROTEGIDA','CONECTAR','DUAT','BUENAVISTA','XHOUSA','MUBARAK','PACK','UNBOXING','5G','GILGAMESH','3%','ALTAR','BACKROOM','APEGO','BIBLIA','REBIS','PLUTÓN','LITERAL','FILTRO','MEDUSA','FILO','SIN TEXTO','FLOW','CATABASIS','BAPHOMET','CARDIO','ROBÓTICA','SIN INTERÉS','JUGAR AL MUERTO','PARÁLISIS DEL SUEÑO','TABLA ESMERALDA','EXTINGUIDOR','TAROT'];let run=false,score=0,lives=3,objs=[],spawn=0,last=0,raf,audio=null,flash=0,roast=false;function snd(f,d=.08){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.frequency.value=f;a.gain.value=.035;o.connect(a);a.connect(audio.destination);o.start();a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}function bg(){if(ART.complete&&ART.naturalWidth)g.drawImage(ART,0,0,720,470);else{g.fillStyle='#07111b';g.fillRect(0,0,720,470)}g.fillStyle='rgba(1,8,15,.2)';g.fillRect(0,0,720,470)}function hud(){H.textContent=score+' / 13 · '+('♥'.repeat(lives)+'♡'.repeat(3-lives))}function make(){let z=Math.random(),kind=z<.48?'bad':z<.78?'good':'myst',arr=kind==='bad'?bad:kind==='good'?good:myst,label=arr[Math.floor(Math.random()*arr.length)];objs.push({label,evil:kind==='bad',kind,x:310+Math.random()*55,y:180+Math.random()*35,v:45+score*2,r:label.length>8?55:43})}function text(t,x,y,s=16){g.textAlign='center';g.textBaseline='middle';g.font='900 '+s+'px monospace';g.fillStyle='#fff';g.fillText(t,x,y)}function draw(){bg();for(const o of objs){g.save();g.shadowColor=o.kind==='myst'?'#d6b8ff':(o.evil?'#ff9b65':'#65e8ff');g.shadowBlur=18;g.fillStyle='rgba(3,15,26,.86)';g.strokeStyle=o.kind==='myst'?'#d6b8ff':(o.evil?'#ff9b65':'#65e8ff');g.lineWidth=3;g.beginPath();g.roundRect(o.x-o.r,o.y-23,o.r*2,46,10);g.fill();g.stroke();text(o.label,o.x,o.y,o.label.length>9?12:16);g.restore()}if(flash){g.fillStyle=flash>0?'rgba(80,230,255,.22)':'rgba(255,55,30,.22)';g.fillRect(0,0,720,470)}}function hit(o,wrong){objs=objs.filter(x=>x!==o);if(wrong){lives--;flash=-1;snd(150,.18);M.textContent='ELIMINASTE INFORMACIÓN QUE PODÍA PASAR';if(navigator.vibrate)navigator.vibrate([50,30,50])}else{score++;flash=1;snd(850,.08);M.textContent='INTERCEPTADO ✓';if(navigator.vibrate)navigator.vibrate(25)}hud();if(score>=13){roast=true;M.textContent='PREMIO DESBLOQUEADO // ROSTIZA';snd(1040,.18);setTimeout(win,650)}else if(lives<=0)lose()}function tap(e){if(!run)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*720/r.width,y=(e.clientY-r.top)*470/r.height;for(let i=objs.length-1;i>=0;i--){let o=objs[i];if(Math.abs(x-o.x)<o.r+12&&Math.abs(y-o.y)<36){if(o.kind==='myst'){objs=objs.filter(x=>x!==o);flash=1;snd(660,.12);M.textContent='INTERFERENCIA // '+o.label+' // SIN CLASIFICAR';if(navigator.vibrate)navigator.vibrate(20)}else hit(o,!o.evil);break}}}function loop(n){if(!run)return;let dt=Math.min(.04,(n-last)/1000||0);last=n;spawn-=dt;if(spawn<=0){make();spawn=Math.max(.78,1.42-score*.022)}for(const o of [...objs]){let dx=565-o.x,dy=360-o.y,d=Math.hypot(dx,dy);o.x+=dx/d*o.v*dt;o.y+=dy/d*o.v*dt;if(d<35){objs=objs.filter(x=>x!==o);if(o.kind==='myst'){M.textContent='ARCHIVO RECIBIDO // '+o.label+' // SIN CLASIFICAR';snd(620,.08)}else if(o.evil){lives--;flash=-1;snd(120,.2);M.textContent='ALGO QUE DEBÍAS FILTRAR LLEGÓ A LA TABLET';hud();if(lives<=0)return lose()}else{M.textContent='INFORMACIÓN ÚTIL RECIBIDA ✓';snd(520,.06)}}}flash*=.88;draw();raf=requestAnimationFrame(loop)}function start(){if(!audio){let C=window.AudioContext||window.webkitAudioContext;if(C)audio=new C()}if(audio&&audio.state==='suspended')audio.resume();run=true;score=0;lives=3;objs=[];spawn=.5;roast=false;B.classList.add('hide');A.classList.add('hide');M.textContent='CUIDÁ LO QUE DEJÁS PASAR.';hud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function lose(){run=false;A.classList.remove('hide');M.textContent='CONEXIÓN PERDIDA';bg();text('¡ROSTIZADA!',360,205,42);text('EL FILTRO FUE SOBRECARGADO',360,255,16)}function win(){run=false;A.classList.remove('hide');M.textContent='ARCHIVO DRAGÓN DESBLOQUEADO';bg();text('ROSTIZA',360,160,52);text('13 / 13',360,215,32);text('ARCHIVO 13 DESBLOQUEADO',360,255,19);text('NO TODO LO QUE LLEGA MERECE ENTRAR.',360,300,15);text('ROSTIZAME // BUENA VISTA',360,355,14)}c.addEventListener('pointerdown',tap);B.addEventListener('click',start);A.addEventListener('click',start);ART.onload=draw;draw()})();</script></body></html>
