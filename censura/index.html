<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROSTIZAME // CENSURA 13</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070a;color:#f6f6f6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;overflow-x:hidden}
body.glitch{animation:glitchbody .22s linear 2}
@keyframes glitchbody{0%{transform:translateX(0)}25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}
header{padding:12px 10px 6px;font-weight:950;letter-spacing:.04em}
.sub{font-size:12px;opacity:.72}
.hud{font-size:16px;font-weight:900;padding:6px 10px}
.wrap{width:min(94vw,760px);margin:auto}
.panel{border:1px solid #2b2f36;background:#0a0e13;box-shadow:0 0 24px #000 inset;border-radius:14px;padding:14px}
.instructions{font-size:13px;opacity:.8;margin:0 0 10px}
.poem{text-align:left;line-height:1.7;font-size:clamp(16px,4vw,22px);padding:8px 4px 4px}
.line{display:block;min-height:1.7em}
.word{display:inline-block;position:relative;border-radius:4px;padding:0 2px;transition:filter .15s,background .15s,color .15s,transform .15s}
.target.live{color:#ff4d4d;background:#3a0000;box-shadow:0 0 10px #ff2a2a88;animation:pulse .7s infinite alternate;cursor:pointer;font-weight:900}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
.target.censored{color:transparent;background:#050505;box-shadow:0 0 0 1px #222 inset;pointer-events:none}
.target.censored:after{content:'████';position:absolute;left:2px;right:2px;top:0;color:#000;text-shadow:0 0 1px #333;overflow:hidden}
.target.saved{color:#7cff91;background:#082811;box-shadow:0 0 8px #48ff6a55;pointer-events:none;font-weight:900}
.life{display:inline-block;margin-left:8px}
.btn{padding:11px 20px;border:1px solid #8c949f;border-radius:10px;background:#11161d;color:white;font-weight:900;margin:8px 5px}
.btn:active{transform:scale(.98)}
.msg{min-height:58px;padding:10px 4px;font-weight:900}
.savedList{font-size:13px;opacity:.8;min-height:40px;padding:2px 8px 10px}
.hide{display:none}
.overlay{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.hide{display:none}
.card{width:min(92vw,520px);background:#090d12;border:1px solid #555;border-radius:14px;padding:22px}
.big{font-size:30px;font-weight:1000;letter-spacing:.03em}
footer{font-size:11px;opacity:.55;padding:12px}

.blackout{position:fixed;inset:0;background:#000;z-index:99999;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-family:monospace;letter-spacing:.12em}
.blackout.hide{display:none}.blackout .sys{max-width:650px;font-size:clamp(18px,5vw,34px);line-height:1.6}
.blackout .dim{opacity:.72;font-size:.55em}.blackout .owned{font-size:clamp(30px,9vw,72px);font-weight:900;line-height:1.15;letter-spacing:.04em}.blackout .lost{font-size:clamp(24px,8vw,58px);animation:blinkLost .32s steps(1) infinite}@keyframes blinkLost{50%{opacity:.08}}body.afterFailure #poem{filter:contrast(1.25);transform:skewX(-.25deg)}body.afterFailure #hud::after{content:' // CONEXIÓN INESTABLE';opacity:.7}

body.chaos #poem{animation:chaosPoem .7s steps(2) infinite}
body.chaos .line:nth-child(3n){transform:translateX(5px)}
body.chaos .line:nth-child(4n){transform:translateX(-7px)}
body.chaos .target:not(.saved):not(.censored){text-shadow:2px 0 #fff,-2px 0 #777}
body.chaos .decoy{color:#ff3030;font-weight:900;cursor:pointer;animation:decoyShake .16s infinite}
body.chaos #hud{animation:hudMad .45s steps(2) infinite}
@keyframes chaosPoem{0%{transform:translate(0,0) skewX(0)}25%{transform:translate(2px,-1px) skewX(-.4deg)}50%{transform:translate(-2px,1px) skewX(.5deg)}75%{transform:translate(1px,1px) skewX(-.2deg)}}
@keyframes decoyShake{0%,100%{transform:translate(0)}50%{transform:translate(2px,-1px)}}
@keyframes hudMad{50%{letter-spacing:.18em;transform:translateX(2px)}}
.flashChaos{position:fixed;inset:0;z-index:9998;pointer-events:none;background:#fff;mix-blend-mode:difference;opacity:0}
body.chaos .flashChaos{animation:flashMad 2.7s steps(1) infinite}
@keyframes flashMad{0%,91%,94%,100%{opacity:0}92%,93%{opacity:.22}}

body.chaos .line.erased{opacity:0;filter:blur(7px);transform:scaleX(.75);transition:opacity .65s ease,filter .65s ease,transform .65s ease}
body.chaos .line.fading{opacity:.18;filter:blur(2px);transition:all .45s ease}
</style>
</head>
<body>
<header>BV // CENSURA 13<div class="sub">ROSTIZAME // ARCHIVO INTERVENIDO</div></header>
<div class="hud" id="hud">INTERCEPTADAS 0/13 <span class="life">♥ ♥ ♥</span></div>
<div class="wrap">
  <div class="panel">
    <p class="instructions">INTERCEPTÁ LAS 13 PALABRAS ROJAS ANTES DE QUE SEAN CENSURADAS.</p>
    <button class="btn" id="start">INICIAR CENSURA + VOZ</button><button class="btn" id="testVoice">PROBAR VOZ</button>
    <div class="poem" id="poem"></div>
    <div class="msg" id="msg">El sistema todavía no empezó a borrar.</div>
    <div class="savedList" id="savedList"></div>
    <button class="btn hide" id="again">REINICIAR ARCHIVO</button>
  </div>
</div>
<footer>ROSTIZAME // BUENA VISTA</footer>
<div class="overlay hide" id="endOverlay">
  <div class="card">
    <div class="big" id="endTitle"></div>
    <div id="endText" style="margin-top:12px;line-height:1.6"></div>
    <button class="btn" id="overlayAgain">VOLVER A INTERCEPTAR</button>
  </div>
</div>
<audio id="voice" preload="auto" playsinline><source src="./sistema2_distorsionado.mp3" type="audio/mpeg"></audio>
<div class="flashChaos"></div><div id="blackout" class="blackout hide"><div class="sys" id="blackoutText"></div></div>
<script>
const voice=document.getElementById("voice");
let voiceCtx=null, voiceSource=null, voiceFilter=null, voiceDist=null, voiceGain=null;
function distortionCurve(amount=180){
 const n=44100,curve=new Float32Array(n),deg=Math.PI/180;
 for(let i=0;i<n;i++){const x=i*2/n-1;curve[i]=(3+amount)*x*20*deg/(Math.PI+amount*Math.abs(x))}
 return curve;
}
function setupVoiceFX(){
 try{
  if(voiceCtx)return;
  voiceCtx=new(window.AudioContext||window.webkitAudioContext)();
  voiceSource=voiceCtx.createMediaElementSource(voice);
  voiceFilter=voiceCtx.createBiquadFilter();voiceFilter.type='highpass';voiceFilter.frequency.value=180;voiceFilter.Q.value=.6;
  voiceDist=voiceCtx.createWaveShaper();voiceDist.curve=distortionCurve(5);voiceDist.oversample='4x';
  voiceGain=voiceCtx.createGain();voiceGain.gain.value=.58;
  voiceSource.connect(voiceFilter);voiceFilter.connect(voiceGain);voiceGain.connect(voiceCtx.destination);
 }catch(e){}
}
async function startVoice(){
 try{
   setupVoiceFX();if(voiceCtx&&voiceCtx.state==='suspended')await voiceCtx.resume();
   voice.pause(); voice.currentTime=0; voice.volume=.72; voice.playbackRate=.94;
   voice.load();
   await voice.play();
   msg.textContent='▶ VOZ ACTIVADA // ARCHIVO SONORO EN CURSO';
 }catch(e){
   msg.innerHTML='⚠ AUDIO BLOQUEADO // <button class="btn" id="audioUnlock" style="padding:6px 10px;margin:0">ACTIVAR VOZ</button>';
   setTimeout(()=>{const b=document.getElementById('audioUnlock');if(b)b.onclick=async()=>{try{voice.volume=1;await voice.play();msg.textContent='▶ VOZ ACTIVADA';}catch(err){msg.textContent='⚠ NO SE PUDO REPRODUCIR EL AUDIO';}}},0);
 }
}
function setVoiceDegradation(step){
 try{
  const p=Math.min(1,step/12);
  /* sin saturación adicional: el archivo ya está procesado */
  if(voiceFilter){voiceFilter.type='highpass';voiceFilter.frequency.value=80+70*p;voiceFilter.Q.value=.35}
  voice.playbackRate=1;
  
  
 }catch(e){}
}
let signalTimer=null;
function clearSignalLoss(){if(signalTimer){clearTimeout(signalTimer);signalTimer=null}try{voice.volume=.72}catch(e){}}
function scheduleSignalLoss(step){
 clearSignalLoss();
 if(step<6||!active)return;
 const severity=Math.min(1,(step-5)/7);
 const drop=()=>{
  if(!active)return;
  const normal=.72;
  voice.volume=.015;
  setTimeout(()=>{if(active)voice.volume=normal},45+Math.random()*65);
  signalTimer=setTimeout(drop,1250+Math.random()*(1900-450*severity));
 };
 signalTimer=setTimeout(drop,900+Math.random()*1100);
}
function voiceGlitch(){try{const base=voice.volume;voice.volume=.48;setTimeout(()=>{voice.volume=base},80)}catch(e){}}
function stopVoice(){try{voice.pause();}catch(e){}}
const lines=[
'Amamos la calefacción de ese vientre',
'Amamos el misil del sistema',
'Su baño de fuego',
'Su pantalla táctil',
'Su dieta líquida',
'su bota de combate sobre las sienes',
'replicar el bombardeo',
'El zoom sociofóbico que descubre sangre pixelada en las fotos',
'¿Querés quedarte ahí?',
'Quien más puede prescindir de vos',
'y mantener stock',
'Qué otra hipnosis animada donde ahogarte',
'y llevar también a tu perro.',
'Esta es la guerra',
'Tendencia y Backroom',
'Ella te luce en su catálago',
'Estás dentro de la ballena',
'con las chinelas puestas.'
];
const targets=['vientre','misil','fuego','pantalla','combate','bombardeo','zoom','sangre','stock','hipnosis','guerra','Backroom','ballena'];
let order=[],idx=0,saved=0,lives=3,active=false,current=null,timer=null,ac=null,midpointDone=false,chaos=false,chaosMsgTimer=null;
const poem=document.getElementById('poem'),hud=document.getElementById('hud'),msg=document.getElementById('msg'),savedList=document.getElementById('savedList'),start=document.getElementById('start'),again=document.getElementById('again'),overlay=document.getElementById('endOverlay'),endTitle=document.getElementById('endTitle'),endText=document.getElementById('endText'),blackout=document.getElementById('blackout'),blackoutText=document.getElementById('blackoutText');
function buildPoem(){
  poem.innerHTML='';
  lines.forEach(line=>{
    const div=document.createElement('span');div.className='line';
    let html=line;
    targets.forEach(t=>{
      const re=new RegExp('('+t.replace(/[.*+?^$()|[\]\\]/g,'\\$&')+')','i');
      html=html.replace(re,'<span class="word target" data-target="'+t.toLowerCase()+'">$1</span>');
    });
    div.innerHTML=html;
    poem.appendChild(div);
  });
  poem.querySelectorAll('.target').forEach(el=>el.addEventListener('click',()=>hit(el)));
}
function audio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}
function tone(f,d=.12,type='sine',v=.09){audio();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function successSound(){tone(680,.07,'square',.025);setTimeout(()=>tone(980,.09,'square',.02),70)}
function censorSound(){tone(120,.14,'sawtooth',.035);setTimeout(()=>tone(75,.16,'sawtooth',.025),90)}
function winSound(){[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.03),i*90))}
function updateHud(){hud.innerHTML='INTERCEPTADAS '+saved+'/13 <span class="life">'+(('♥ '.repeat(lives).trim())||'—')+'</span>'}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function resetMarks(){poem.querySelectorAll('.target').forEach(el=>el.classList.remove('live','saved','censored'));poem.querySelectorAll('.decoy').forEach(el=>el.classList.remove('decoy'));poem.querySelectorAll('.line').forEach(el=>el.classList.remove('erased','fading'))}
function chaosMessages(){
 if(!active||!chaos)return;
 const m=['NO INTERCEPTES','INTERCEPTÁ TODO','USUARIO DETECTADO','ESTO NO ES UNA PALABRA','ERROR // ERROR // ERROR','¿QUERÉS QUEDARTE AHÍ?','LA PANTALLA TE ESTÁ MIRANDO','ARCHIVO SIN PROPIETARIO'];
 msg.textContent='⚠ '+m[Math.floor(Math.random()*m.length)];
 chaosMsgTimer=setTimeout(chaosMessages,650+Math.random()*850);
}
function erasePoemStep(){
 if(!chaos)return;
 if(idx<10 && idx%2===1)return;
 const lines=[...poem.querySelectorAll('.line')];
 const available=lines.filter(l=>!l.classList.contains('erased')&&!l.querySelector('.live'));
 if(!available.length)return;
 const count=idx>=11?2:1;
 shuffle(available).slice(0,count).forEach((line,n)=>{
   setTimeout(()=>{
     line.classList.add('fading');
     setTimeout(()=>{line.classList.remove('fading');line.classList.add('erased')},420);
   },n*160);
 });
}
function addDecoys(){
 const candidates=[...poem.querySelectorAll('.word:not(.saved):not(.censored):not(.live)')];
 shuffle(candidates).slice(0,Math.min(4,candidates.length)).forEach(el=>{
   el.classList.add('decoy');
   el.onclick=()=>{if(!active||!chaos)return;censorSound();msg.textContent='✕ FALSO OBJETIVO // EL SISTEMA TE VIO';if(navigator.vibrate)navigator.vibrate([40,30,40]);setTimeout(()=>el.classList.remove('decoy'),450)}
 });
}
function startGame(){audio();startVoice();active=true;saved=0;lives=3;idx=0;midpointDone=false;chaos=false;clearTimeout(chaosMsgTimer);document.body.classList.remove('chaos','afterFailure');blackout.classList.add('hide');setVoiceDegradation(0);current=null;clearTimeout(timer);order=shuffle(targets);resetMarks();updateHud();savedList.textContent='';msg.textContent='ARCHIVO ACTIVO // ESPERANDO PRIMERA PALABRA';start.classList.add('hide');again.classList.add('hide');overlay.classList.add('hide');setTimeout(nextTarget,chaos?1050:500)}
function midpointFailure(){
 midpointDone=true;clearTimeout(timer);clearSignalLoss();
 const wasPlaying=!voice.paused;voice.pause();
 blackoutText.innerHTML='<div class="lost">████ SEÑAL PERDIDA ████</div>';
 blackout.classList.remove('hide');
 if(navigator.vibrate)navigator.vibrate([180,100,180,100,400]);
 setTimeout(()=>{blackoutText.innerHTML=''},1500);
 setTimeout(()=>{blackoutText.innerHTML='<div class="dim">CONEXIÓN RESTABLECIDA</div>'},2800);
 setTimeout(()=>{blackoutText.innerHTML='<div class="owned">LA VOZ<br>YA NO TE<br>PERTENECE</div>'},3900);
 setTimeout(async()=>{
   blackout.classList.add('hide');document.body.classList.add('afterFailure','chaos');chaos=true;addDecoys();chaosMessages();
   msg.textContent='⚠ TRANSMISIÓN ALTERADA // CONTINUÁ';
   if(wasPlaying){try{voice.volume=.62;await voice.play()}catch(e){}}
   setTimeout(nextTarget,700)
 },6900);
}
function nextTarget(){if(!active)return;if(idx>=order.length)return finishWin();if(idx>=6&&!midpointDone)return midpointFailure();setVoiceDegradation(idx);scheduleSignalLoss(idx);current=order[idx].toLowerCase();const el=[...poem.querySelectorAll('.target')].find(x=>x.dataset.target===current);if(!el){idx++;return nextTarget()}el.classList.add('live');msg.textContent='⚠ PALABRA DETECTADA // INTERCEPTALA';document.body.classList.add('glitch');setTimeout(()=>document.body.classList.remove('glitch'),250);if(navigator.vibrate)navigator.vibrate(20);const delay=chaos?(1450+Math.floor(Math.random()*1050)):(1800+Math.floor(Math.random()*1200));if(chaos){erasePoemStep();addDecoys();document.body.classList.add('glitch');setTimeout(()=>document.body.classList.remove('glitch'),420)}timer=setTimeout(()=>censor(el),delay)}
function hit(el){if(!active||!el.classList.contains('live'))return;clearTimeout(timer);el.classList.remove('live');el.classList.add('saved');saved++;idx++;successSound();msg.textContent='✓ INTERCEPTADA // '+el.textContent.toUpperCase();savedList.textContent='RESCATADAS: '+[...poem.querySelectorAll('.saved')].map(x=>x.textContent.toUpperCase()).join(' · ');updateHud();setTimeout(nextTarget,500)}
function censor(el){if(!active)return;el.classList.remove('live');el.classList.add('censored');lives--;idx++;censorSound();voiceGlitch();updateHud();msg.textContent='████ CENSURADA // PERDISTE UNA VIDA';if(navigator.vibrate)navigator.vibrate([80,40,120]);if(lives<=0)return finishLose();setTimeout(nextTarget,chaos?1150:650)}
function finalInterceptReveal(title,html){
 endTitle.textContent=title;endText.innerHTML=html;overlay.classList.remove('hide');
 setTimeout(()=>{endText.innerHTML=html+'<br><br><strong>1 USUARIO INTERCEPTADO</strong>'},1800);
 setTimeout(()=>{endText.innerHTML='<strong>ROSTIZAME // BV</strong>';again.classList.remove('hide')},3600);
}
function finishWin(){active=false;clearTimeout(timer);clearTimeout(chaosMsgTimer);clearSignalLoss();stopVoice();winSound();const words=[...poem.querySelectorAll('.saved')].map(x=>x.textContent.toUpperCase()).join(' · ');finalInterceptReveal('CENSURA INTERRUMPIDA // 13 DE 13','El resto del texto cae.<br><br><strong>'+words+'</strong><br><br>ARCHIVO RECUPERADO.')}

function finishLose(){active=false;clearTimeout(timer);clearTimeout(chaosMsgTimer);clearSignalLoss();stopVoice();finalInterceptReveal('ROSTIZADXS','El sistema terminó de borrar el archivo.<br><br>INTERCEPTADAS: <strong>'+saved+'/13</strong>')}
start.onclick=startGame;
document.getElementById('testVoice').onclick=async function(){
 try{
  voice.pause();voice.currentTime=0;voice.volume=1;voice.playbackRate=1;voice.load();
  await voice.play();
  msg.textContent='▶ SI ESCUCHÁS ESTO, LA VOZ FUNCIONA';
 }catch(e){msg.textContent='⚠ ERROR DE AUDIO: '+(e.name||'desconocido')}
};
again.onclick=startGame;document.getElementById('overlayAgain').onclick=startGame;buildPoem();updateHud();
</script>
</body>
</html>
